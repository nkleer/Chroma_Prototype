<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}</style></head><body><title>Chroma Life Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
<style>
  /* Arcane night: one dark look on purpose (Emren 2026-10-05 08:02: a card table with an arcane night effect). */
  :root {
    --night0: #07060d; --night1: #0c0a17; --night2: #13112a; --night3: #1c1838; --night4: #262046;
    --ink: #ece4d2; --ink2: #cfc5ae; --muted: #958ca8; --faint: #5f5878; --line: #2a2448;
    --gold: #d8b469; --gold2: #f4dfa6; --gold3: #8a6a2c;
    --arcane: #b3a2f7; --arcane2: #7a68dc; --arcane3: #2b2160;
    --ok: #79d29a; --bad: #f2856d;
    --cW: #f2e3a6; --cU: #82b9f2; --cB: #bba0d0; --cR: #f38c6b; --cG: #7fd394;
    --dW: #8d7a3b; --dU: #1f4f8a; --dB: #3a2d4b; --dR: #8c2f1f; --dG: #1f6136;
    --pW: #f8f1d3; --pU: #abcff1; --pB: #c3b8bf; --pR: #f3ae90; --pG: #addaa1; --pInk: #1b1814;
    --parch: #efe5cc; --parch2: #ddcca4; --parchInk: #2a2116; --parchMuted: #6d5c41;
    --sat: #e8bb55; --peace: #5fcac3; --stress: #f2856d; --want: #b79cf3;
    --heart: #f08aa4; --head: #a99cf6;
    --t1: var(--arcane2); --t2: var(--arcane2);
    --display: "Cinzel", "Trajan Pro", Georgia, serif;
    --serif: "Spectral", Georgia, "Times New Roman", serif;
    --ui: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
    --cw: 168px; --ch: 238px;
    --hl: 255 255 255;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--night0); color: var(--ink); font-family: var(--ui); font-size: 14px; line-height: 1.45; overflow: hidden; }
  button { font: inherit; color: inherit; }
  svg.i { width: 1em; height: 1em; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.14em; }
  .W { color: var(--cW); } .U { color: var(--cU); } .B { color: var(--cB); } .R { color: var(--cR); } .G { color: var(--cG); }
  em { font-style: italic; }
  ::selection { background: var(--arcane3); }
  * { scrollbar-width: thin; scrollbar-color: var(--night4) transparent; }

  /* ---------- the night sky ---------- */
  .sky { position: fixed; inset: 0; pointer-events: none; overflow: hidden;
    background:
      radial-gradient(1200px 700px at 72% -10%, rgb(70 52 150 / 0.30), transparent 65%),
      radial-gradient(900px 600px at 0% 105%, rgb(36 70 120 / 0.22), transparent 70%),
      radial-gradient(700px 500px at 100% 100%, rgb(110 40 90 / 0.14), transparent 70%),
      linear-gradient(180deg, #0b0918 0%, #07060d 70%); }
  .sky::before, .sky::after { content: ""; position: absolute; inset: -50%; }
  .sky::before { background-image:
      radial-gradient(1px 1px at 20px 30px, rgb(var(--hl) / 0.7), transparent 2px),
      radial-gradient(1px 1px at 140px 80px, rgb(255 240 210 / 0.55), transparent 2px),
      radial-gradient(1.5px 1.5px at 260px 160px, rgb(200 210 255 / 0.6), transparent 2px),
      radial-gradient(1px 1px at 60px 220px, rgb(var(--hl) / 0.45), transparent 2px),
      radial-gradient(1px 1px at 330px 260px, rgb(var(--hl) / 0.5), transparent 2px);
    background-size: 380px 300px; opacity: 0.55; }
  .sky::after { background-image:
      radial-gradient(1.5px 1.5px at 90px 50px, rgb(255 236 190 / 0.9), transparent 2px),
      radial-gradient(1px 1px at 300px 190px, rgb(190 205 255 / 0.8), transparent 2px),
      radial-gradient(2px 2px at 520px 120px, rgb(var(--hl) / 0.7), transparent 3px);
    background-size: 640px 420px; animation: twinkle 7s ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: 0.25; } to { opacity: 0.85; } }
  .glow { position: fixed; inset: 0; pointer-events: none; transition: background 1.4s;
    background: radial-gradient(800px 380px at 30% 38%, color-mix(in srgb, var(--t1) 13%, transparent), transparent 70%),
                radial-gradient(700px 360px at 62% 70%, color-mix(in srgb, var(--t2) 10%, transparent), transparent 70%); }
  .sigil { position: fixed; width: min(78vh, 760px); aspect-ratio: 1; left: 38%; top: 58%; translate: -50% -50%; pointer-events: none;
    opacity: 0.075; animation: turn 240s linear infinite; }
  .sigil * { fill: none; stroke: var(--gold2); stroke-width: 0.6; }
  .sigil use { fill: var(--gold2); stroke: none; }
  @keyframes turn { to { rotate: 360deg; } }

  /* ---------- the app frame ---------- */
  .app { position: relative; height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); max-width: 1500px; margin: 0 auto;
    padding-inline: 16px; box-sizing: border-box; }
  .bar { display: flex; align-items: center; gap: 14px; min-height: 48px; padding-block: 6px; min-width: 0; }
  .brand { font-family: var(--display); font-weight: 700; letter-spacing: 0.26em; font-size: 15px; color: var(--gold); display: flex; align-items: center; gap: 10px;
    text-shadow: 0 0 18px rgb(216 180 105 / 0.35); }
  .who { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
  .who .nm { font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: 0.06em; white-space: nowrap; }
  .who .age { display: flex; align-items: baseline; gap: 6px; color: var(--ink2); white-space: nowrap; }
  .who .age b { font-family: var(--display); font-size: 20px; color: var(--gold2); font-weight: 600; }
  .who .age small { color: var(--muted); font-size: 12px; text-transform: capitalize; }
  .who .crest { display: inline-flex; align-items: center; gap: 7px; padding: 3px 11px 3px 6px; border-radius: 999px; background: rgb(var(--hl) / 0.04);
    box-shadow: inset 0 0 0 1px rgb(216 180 105 / 0.22); cursor: help; min-width: 0; }
  .who .crest .gn { font-family: var(--display); font-size: 13px; letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tools { display: flex; gap: 4px; align-items: center; }
  .tbtn { display: inline-flex; align-items: center; gap: 6px; background: transparent; border: 0; border-radius: 8px; padding: 6px 9px; cursor: pointer;
    color: var(--ink2); font-size: 12.5px; }
  .tbtn:hover { background: rgb(var(--hl) / 0.06); color: var(--ink); }
  .tbtn .v { color: var(--gold); text-transform: capitalize; }
  .tbtn[aria-pressed="true"] { color: var(--gold2); background: rgb(216 180 105 / 0.1); }
  .tbtn:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .hud-toggle, .hud .hud-close { display: none; }
  .hud-close { position: sticky; top: 0; align-self: flex-end; z-index: 3; margin-bottom: -40px; }

  /* mana pips */
  .pip { display: inline-grid; place-items: center; width: 1.25em; height: 1.25em; border-radius: 50%; color: var(--pInk);
    box-shadow: inset 0 -1px 0 rgb(0 0 0 / 0.25), 0 0 0 1px rgb(0 0 0 / 0.35), 0 0 8px rgb(var(--hl) / 0.08); flex: none; vertical-align: -0.25em; }
  .pip svg { width: 74%; height: 74%; fill: currentColor; }
  .pip.pW { background: var(--pW); } .pip.pU { background: var(--pU); } .pip.pB { background: var(--pB); }
  .pip.pR { background: var(--pR); } .pip.pG { background: var(--pG); }
  .pip.dim { opacity: 0.25; }
  .pips { display: inline-flex; gap: 2px; align-items: center; }
  .pips .to { color: var(--faint); font-size: 0.8em; margin-inline: 1px; }

  /* ---------- part 1: the life line ---------- */
  .line { position: relative; height: 116px; margin-block: 2px 10px; border-radius: 14px; overflow: hidden;
    background: linear-gradient(180deg, rgb(var(--hl) / 0.025), rgb(var(--hl) / 0.01)); }
  .line svg.river { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .river .lay { transition: d 0.4s; }
  .river .glowl { filter: blur(7px); opacity: 0.55; }
  .river .tick { fill: var(--faint); font: 500 10.5px var(--ui); text-anchor: middle; }
  .river .tick.known { fill: var(--muted); }
  .river .grid { stroke: rgb(var(--hl) / 0.05); stroke-width: 1; }
  .river .path { stroke: rgb(216 180 105 / 0.35); stroke-width: 1.2; stroke-dasharray: 2 5; fill: none; }
  .river .nowl { stroke: var(--gold2); stroke-width: 1.5; }
  .river .nowg { stroke: var(--gold); stroke-width: 7; opacity: 0.18; filter: blur(3px); }
  .river .nowdot { fill: var(--gold2); filter: drop-shadow(0 0 6px var(--gold)); }
  .river .nowt { fill: var(--gold2); font: 600 11px var(--display); letter-spacing: 0.06em; }
  .river .cross { stroke: rgb(var(--hl) / 0.5); stroke-width: 1; stroke-dasharray: 2 3; }
  .river .gl { cursor: pointer; }
  .river .gl circle { fill: var(--night2); stroke: rgb(var(--hl) / 0.18); }
  .river .gl use { stroke: var(--ink2); fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .river .gl.big circle { stroke: var(--gold); }
  .river .gl.dark use { stroke: #cdb8e8; }
  .river .gl.bad circle { stroke: var(--bad); }
  .river .gl:hover circle { fill: var(--night4); }
  .river .end use { stroke: var(--gold2); }
  .river .hov { fill: transparent; cursor: crosshair; }
  .fog { position: absolute; top: 0; bottom: 0; right: 0; pointer-events: none; transition: opacity 2.4s ease, left 0.5s ease;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 70px); mask-image: linear-gradient(90deg, transparent 0, #000 70px); }
  .fog i { position: absolute; inset: -40% -20%; display: block;
    background: radial-gradient(closest-side, rgb(176 166 220 / 0.20), transparent) 0 0 / 260px 150px,
                radial-gradient(closest-side, rgb(120 110 180 / 0.24), transparent) 130px 60px / 340px 170px,
                radial-gradient(closest-side, rgb(210 200 240 / 0.12), transparent) 60px 20px / 180px 120px;
    filter: blur(8px); animation: drift 38s linear infinite; }
  .fog i:nth-child(2) { animation-duration: 61s; animation-direction: reverse; opacity: 0.8; background-position: 90px 30px, 0 80px, 200px 0; }
  .fog i:nth-child(3) { inset: 0; filter: none; animation: none;
    background: linear-gradient(90deg, rgb(20 16 40 / 0.0), rgb(20 16 40 / 0.55) 30%, rgb(14 11 28 / 0.88)); }
  .fog b { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #e8e0ff; box-shadow: 0 0 6px #b7a8ff; animation: mote 6s ease-in-out infinite; }
  .fog .q { position: absolute; right: 22px; top: 50%; translate: 0 -50%; font: 500 12px var(--display); letter-spacing: 0.3em; color: rgb(214 205 245 / 0.45); white-space: nowrap; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-260px); } }
  @keyframes mote { 0%, 100% { opacity: 0; transform: translateY(4px); } 50% { opacity: 0.9; transform: translateY(-4px); } }
  .line.clear .fog { opacity: 0; }

  /* ---------- the main area ---------- */
  main { display: grid; grid-template-columns: minmax(0, 1fr) 304px; gap: 30px; min-height: 0; }
  .stage { position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
  .chron { flex: 1 1 auto; min-height: 90px; overflow-y: auto; overscroll-behavior: contain; padding: 4px 18px 22px 46px; transition: opacity 0.4s;
    -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 22px); mask-image: linear-gradient(180deg, transparent 0, #000 22px); }
  .stage.atcp .chron { min-height: 56px; }

  .chron .inner { max-width: 760px; margin: 0 auto; }

  /* years */
  .yr { margin-block: 0 4px; scroll-margin-top: 14px; }
  .yh { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 10px 0 4px; user-select: none; position: relative; }
  .yh .ag { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: 0.14em; color: var(--gold); min-width: 4.4em; white-space: nowrap; }
  .yh .ag small { font-size: 10px; letter-spacing: 0.2em; color: var(--gold3); margin-right: 4px; }
  .yh .gd { display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); font-family: var(--display); font-size: 12.5px; letter-spacing: 0.05em; min-width: 0; }
  .yh .gd .ep { font-family: var(--serif); font-style: italic; letter-spacing: 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .yh .rule { flex: 1; height: 1px; background: linear-gradient(90deg, rgb(216 180 105 / 0.28), transparent); min-width: 20px; }
  .yh .icons { display: inline-flex; gap: 5px; color: var(--muted); font-size: 12px; }
  .yh .mood { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
  .yh .mood b { width: 3px; border-radius: 2px; }
  .yr .lead { font-family: var(--serif); font-size: 16px; line-height: 1.6; color: var(--ink2); margin: 2px 0 8px; }
  .yr.closed .ents { display: none; }
  .yr.closed .lead { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14.5px; color: var(--muted); margin-bottom: 0; }
  .yr.closed .lead .mk { color: inherit !important; text-decoration: none; }
  .yr.flash .ents, .yr.flash .lead { animation: flash 1.6s ease; }
  @keyframes flash { 0% { background: rgb(216 180 105 / 0.16); } 100% { background: transparent; } }
  .ents { display: flex; flex-direction: column; gap: 10px; }
  .en { position: relative; font-family: var(--serif); font-size: 16.5px; line-height: 1.62; color: var(--ink); }
  .en .gut { position: absolute; left: -32px; top: 3px; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%;
    color: var(--muted); background: rgb(var(--hl) / 0.03); font-size: 13px; }
  .en.minor { font-size: 15px; color: var(--ink2); }
  .en.minor .gut { opacity: 0.7; }
  .en.choice { padding: 9px 12px 10px 14px; border-radius: 10px; background: linear-gradient(90deg, rgb(var(--hl) / 0.045), rgb(var(--hl) / 0.015));
    box-shadow: inset 3px 0 0 var(--edge, var(--gold)); }
  .en.choice .gut { color: var(--gold); background: rgb(216 180 105 / 0.12); left: -32px; top: 10px; }
  .en.choice .res { float: right; margin: 1px 0 0 10px; font-family: var(--ui); font-size: 12px; display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
  .en.choice .res .ok { color: var(--ok); } .en.choice .res .bad { color: var(--bad); }
  .en.loss .gut, .en.death .gut { color: #d9c3ee; background: rgb(150 120 200 / 0.14); }
  .en.ledger { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; color: var(--muted); white-space: pre-wrap; line-height: 1.4; }
  .en.start { font-family: var(--display); font-size: 13px; letter-spacing: 0.08em; color: var(--gold); text-align: center; padding: 8px 0; }
  .en.birth { font-size: 17px; }
  .prologue .ents { padding-top: 12px; }

  /* interactive story text */
  .mk { cursor: help; border-radius: 3px; transition: background 0.15s, color 0.15s; }
  .mk:hover, .mk.on { background: rgb(var(--hl) / 0.07); }
  .mk-p { color: var(--gold2); }
  .mk-a, .mk-v { text-decoration: underline dotted; text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
  .mk-a { color: #e9dcc0; text-decoration-color: var(--gold3); }
  .mk-o { text-decoration: underline dotted; text-decoration-thickness: 1.5px; text-underline-offset: 4px; color: #e9dcc0; text-decoration-color: var(--gold3); font-weight: 600; }
  .mk-w { color: var(--muted); text-decoration: underline dashed rgb(150 140 170 / 0.6); text-underline-offset: 4px; }
  .mk-t { color: #cbbdf5; }
  .mk-t.c-W { color: #efe3b4; } .mk-t.c-U { color: #a7cdf4; } .mk-t.c-B { color: #cdb6dd; } .mk-t.c-R { color: #f5ab92; } .mk-t.c-G { color: #a6dfb2; }
  .mk-a.c-W, .mk-v.c-W, .mk-o.c-W { color: var(--cW); text-decoration-color: rgb(242 227 166 / 0.55); }
  .mk-a.c-U, .mk-v.c-U, .mk-o.c-U { color: var(--cU); text-decoration-color: rgb(130 185 242 / 0.55); }
  .mk-a.c-B, .mk-v.c-B, .mk-o.c-B { color: var(--cB); text-decoration-color: rgb(187 160 208 / 0.55); }
  .mk-a.c-R, .mk-v.c-R, .mk-o.c-R { color: var(--cR); text-decoration-color: rgb(243 140 107 / 0.55); }
  .mk-a.c-G, .mk-v.c-G, .mk-o.c-G { color: var(--cG); text-decoration-color: rgb(127 211 148 / 0.55); }
  .mk-m, .mk-d, .mk-s, .mk-k, .mk-f, .mk-x, .mk-e, .mk-r, .mk-c, .mk-b, .mk-h, .mk-q, .mk-T, .mk-R, .mk-B, .mk-C {
    color: var(--arcane); text-decoration: underline dotted rgb(179 162 247 / 0.45); text-underline-offset: 4px; }
  .mk-m { color: #d8cdf7; }
  .lead .mk-m { color: inherit; }
  .mk .mk-p { text-decoration: none; }

  /* ---------- part 2: the table (a checkpoint) ---------- */
  .table { flex: none; position: relative; padding: 6px 0 4px; display: flex; flex-direction: column; gap: 10px; max-height: calc(100% - 64px); overflow-y: auto; overscroll-behavior: contain; }
  .cpm { position: relative; margin: 0 auto; width: min(100%, 860px); box-sizing: border-box; padding: 16px 22px 14px; border-radius: 16px;
    background: radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--t1) 16%, transparent), transparent 60%),
                linear-gradient(180deg, rgb(28 24 56 / 0.92), rgb(17 14 36 / 0.94));
    box-shadow: 0 18px 50px -24px rgb(0 0 0 / 0.9), inset 0 0 0 1px rgb(216 180 105 / 0.28); isolation: isolate; animation: rise 0.45s ease both; }
  .cpm::before { content: ""; position: absolute; inset: -1px; border-radius: 17px; padding: 1px; z-index: -1; opacity: 0.85;
    background: conic-gradient(from var(--spin, 0deg), var(--t1), transparent 25%, var(--t2) 50%, transparent 75%, var(--t1));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: spin 9s linear infinite; }
  @property --spin { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @keyframes spin { to { --spin: 360deg; } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .mh { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .mh .kick { font: 600 11px var(--ui); letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); display: inline-flex; align-items: center; gap: 6px; }
  .mh h2 { margin: 0; font: 600 21px/1.2 var(--display); letter-spacing: 0.03em; color: var(--ink); flex: 1; min-width: 12ch; text-wrap: balance; }
  .mh .stakes { display: inline-flex; gap: 1px; color: var(--stress); cursor: help; font-size: 15px; }
  .mh .stakes .off { color: var(--faint); opacity: 0.5; }
  .cpm .scene { font-family: var(--serif); font-size: 18px; line-height: 1.6; margin: 10px 0 4px; color: var(--ink); }
  .cpm .note { font-family: var(--serif); font-size: 15.5px; line-height: 1.55; margin: 6px 0 0; color: var(--ink2); }

  .hand { position: relative; height: calc(var(--ch) + 30px); margin-top: 2px; }
  .hand.flow { height: auto; display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 18px 4px 10px; }
  .handnote { text-align: center; color: var(--muted); font-size: 12px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .handnote b { color: var(--gold); font-weight: 500; }

  /* ---------- Magic-style option cards ---------- */
  .mtg { position: absolute; top: 18px; width: var(--cw); height: var(--ch); padding: 0; border: 0; background: none; cursor: pointer; text-align: left;
    transform: translateY(var(--dy, 0)) rotate(var(--rot, 0deg)); transform-origin: 50% 120%; transition: transform 0.22s ease, filter 0.22s;
    animation: deal 0.5s cubic-bezier(.2, .8, .3, 1) both; animation-delay: calc(var(--n, 0) * 70ms); }
  .hand.flow .mtg { position: relative; top: 0; flex: none; scroll-snap-align: center; transform: none; }
  @keyframes deal { from { opacity: 0; transform: translateY(70px) rotate(calc(var(--rot, 0deg) * 3)); } }
  .mtg:hover, .mtg:focus-visible, .mtg.sel { transform: translateY(-16px) rotate(0) scale(1.05); z-index: 60 !important; outline: none; }
  .hand.flow .mtg.sel { transform: translateY(-8px); }
  .mtg .fr { position: absolute; inset: 0; border-radius: 11px; padding: 7px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px;
    background: #0d0b10; box-shadow: 0 14px 28px -12px rgb(0 0 0 / 0.95), 0 0 0 1px rgb(var(--hl) / 0.06); }
  .mtg .fr::before { content: ""; position: absolute; inset: 4px; border-radius: 8px; background: var(--frame); z-index: 0; }
  .mtg .fr > * { position: relative; z-index: 1; }
  .mtg .nl, .mtg .tl { display: flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 5px; min-height: 20px;
    background: linear-gradient(180deg, #f3ead3, #d9caa5); color: var(--parchInk); box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.35), 0 1px 0 rgb(var(--hl) / 0.2); }

  /* ---------- part 3: the character HUD ---------- */

  .hud .crestbox .ep { font: italic 14px var(--serif); color: var(--ink2); }
  .hud .crestbox .vo { font-size: 11.5px; color: var(--muted); }
  svg.wheel { width: 100%; max-width: 236px; display: block; margin: -4px auto -6px; overflow: visible; }

  .wheel .orb.hl { filter: drop-shadow(0 0 7px #fff); transform: scale(1.18); }
  .rings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .rg { display: grid; justify-items: center; gap: 2px; cursor: help; }
  .rg svg { width: 56px; height: 56px; display: block; }

  .rg .fg { fill: none; stroke-width: 5; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dasharray 0.5s; filter: drop-shadow(0 0 3px currentColor); }
  .rg .mark { stroke: var(--ink); stroke-width: 2; }
  .rg use { stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .rg span { font-size: 10.5px; color: var(--muted); letter-spacing: 0.04em; }
  .hsec { display: grid; gap: 8px; }
  .hsec h4 { margin: 0; font: 600 10.5px var(--ui); letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold3); display: flex; align-items: center; gap: 8px; }

  .means { display: grid; gap: 6px; }

  .seg { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; }

  .seg b.on { background: var(--mc, var(--gold)); box-shadow: 0 0 5px color-mix(in srgb, var(--mc, var(--gold)) 60%, transparent); }
  .mrow .v { font-size: 11px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .sockets { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .sock { display: grid; justify-items: center; gap: 3px; cursor: help; }
  .sock .o { position: relative; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; color: var(--faint);
    background: rgb(var(--hl) / 0.025); box-shadow: inset 0 0 0 1px rgb(var(--hl) / 0.1); }
  .sock .o::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1.5px dashed rgb(var(--hl) / 0.12); }
  .sock.on .o { color: var(--ink); background: radial-gradient(circle, rgb(var(--hl) / 0.08), rgb(var(--hl) / 0.02)); box-shadow: 0 0 14px -2px var(--sc, var(--gold)); }
  .sock.on .o::before { border: 0; padding: 2.5px; background: conic-gradient(var(--sc, var(--gold)) var(--yrs, 0%), rgb(var(--hl) / 0.1) 0);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }

  .perk.off { opacity: 0.45; text-decoration: line-through; }

  .sock .tn { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-align: center; line-height: 1.15; max-width: 100%; }
  .sock .tn.lw { font-size: 8.5px; } .sock .tn.xw { font-size: 8px; }
  .sock .fc { font-size: 9px; font-style: italic; color: var(--faint); margin-top: -2px; max-width: 100%; overflow: hidden; text-align: center; line-height: 1.1;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .sock.on .fc { color: var(--muted); }
  .perks.stats { margin-top: 8px; }

  .people { display: flex; flex-wrap: wrap; gap: 6px; }

    background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--ac) 45%, #1a1630), #15122a); color: var(--ink); box-shadow: 0 0 0 1.5px var(--ac), 0 0 10px -3px var(--ac); }

  .chips { display: flex; flex-wrap: wrap; gap: 4px; }

  .empty { color: var(--faint); font-size: 12px; font-style: italic; }

  .insight { position: relative; font: italic 400 16px/1.45 var(--serif); color: var(--ink); margin: 0; padding: 6px 14px 7px; border-radius: 10px;
    background: linear-gradient(90deg, rgb(240 138 164 / 0.09), rgb(169 156 246 / 0.09)); box-shadow: inset 2px 0 0 var(--heart), inset -2px 0 0 var(--head); }

  .tipbar i { height: 5px; border-radius: 3px; background: rgb(var(--hl) / 0.08); overflow: hidden; } .tipbar i b { display: block; height: 100%; }

  .drm.dream .gn { font-style: italic; color: var(--ink2); }
  .drm .gbar { height: 4px; border-radius: 2px; background: rgb(var(--hl) / 0.07); margin-top: 3px; overflow: hidden; }
  .drm .gbar b { display: block; height: 100%; border-radius: 2px; background: var(--gbg, var(--arcane)); }
  .drm .gv { font: 600 11px var(--ui); color: var(--muted); font-variant-numeric: tabular-nums; display: inline-flex; gap: 4px; align-items: center; }
  .drm .gv .mine { color: var(--gold); }
  .addplan { justify-self: start; font-size: 12px; padding: 5px 11px; color: var(--gold2); }
  /* making a plan */
  .plan .box { width: min(560px, 100%); }
  .plan .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 12px 0; }
  .plan .bigfelt { display: flex; align-items: center; gap: 16px; margin: 10px 0; }
  .plan .bigfelt > b { font: 700 34px var(--display); color: var(--gold2); }
  .plan .bigfelt .hintw { color: var(--gold2); font-weight: 600; }
  .plan .held { display: grid; gap: 6px; margin: 10px 0 4px; }
  .plan .held .drm { cursor: default; }
  .plan .xbtn { padding: 3px 9px; font-size: 11.5px; }
  .plan .drm { grid-template-columns: 22px 1fr auto auto; }
  .plan .ch { display: flex; align-items: center; gap: 8px; }
  .plan .ch:disabled { opacity: 0.38; cursor: default; }
  table.kv { border-collapse: collapse; font-size: 13px; } table.kv td { padding: 3px 14px 3px 0; vertical-align: top; } table.kv td:first-child { color: var(--muted); white-space: nowrap; }

  /* ---------- transport ---------- */
  .transport { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
  .primary { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 10px; padding: 9px 18px; cursor: pointer; white-space: nowrap;
    background: linear-gradient(180deg, #e8c57c, #b98d3c); color: #1d1406; font-weight: 600; letter-spacing: 0.02em;
    box-shadow: 0 0 0 1px rgb(0 0 0 / 0.4), 0 6px 20px -8px rgb(216 180 105 / 0.8), inset 0 1px 0 rgb(var(--hl) / 0.45); }
  .primary:hover { filter: brightness(1.08); }
  .primary:disabled { filter: grayscale(0.7) brightness(0.7); cursor: default; }
  .ghost { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 9px; padding: 8px 14px; background: rgb(var(--hl) / 0.06); cursor: pointer; }
  .steps4 { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: rgb(var(--hl) / 0.04); }
  .steps4 button { display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; border-radius: 7px; padding: 5px 9px; cursor: pointer; color: var(--ink2); font-size: 12px; }
  .steps4 button:hover:not(:disabled) { background: rgb(var(--hl) / 0.07); }
  .steps4 button:disabled { opacity: 0.35; cursor: default; }
  .live { color: var(--muted); font-size: 12.5px; display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgb(216 180 105 / 0.25); border-top-color: var(--gold); animation: sp 0.8s linear infinite; flex: none; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* ---------- menu, setup, review, boot ---------- */
  .screen { flex: 1; overflow-y: auto; padding: 6px 4px 20px; }
  .hero { text-align: center; padding: 10px 0 18px; }
  .hero h1 { margin: 0; font: 700 38px var(--display); letter-spacing: 0.32em; color: var(--gold2); text-shadow: 0 0 30px rgb(216 180 105 / 0.45); padding-left: 0.32em; }
  .hero p { margin: 8px 0 0; font: italic 17px var(--serif); color: var(--ink2); }
  .hero .pips { font-size: 17px; gap: 6px; margin-top: 8px; }
  .presets { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; --cw: 158px; --ch: 228px; }
  .presets .mtg { position: relative; top: 0; transform: none; }
  .presets .mtg:hover { transform: translateY(-8px) scale(1.03); }
  .presets .mtg .tx .ru { font-size: 11.4px; line-height: 1.27; }
  .setup { max-width: 640px; margin: 10px auto; padding: 22px 24px; border-radius: 16px; background: linear-gradient(180deg, rgb(28 24 56 / 0.92), rgb(17 14 36 / 0.94));
    box-shadow: inset 0 0 0 1px rgb(216 180 105 / 0.25), 0 20px 50px -25px #000; }
  .setup .steps { display: flex; gap: 4px; margin-bottom: 12px; } .setup .steps b { flex: 1; height: 3px; border-radius: 2px; background: rgb(var(--hl) / 0.1); } .setup .steps b.on { background: var(--gold); }
  .setup .ttl { font-size: 11.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
  .setup h2 { margin: 6px 0 4px; font: 600 22px var(--display); text-wrap: balance; }
  .setup .hint { margin: 0 0 14px; color: var(--muted); font-family: var(--serif); font-size: 15px; }
  .choices { display: grid; gap: 8px; }
  .ch { text-align: left; border: 0; border-radius: 11px; padding: 10px 14px; background: rgb(var(--hl) / 0.05); cursor: pointer; display: grid; gap: 2px; }
  .ch:hover { background: rgb(216 180 105 / 0.12); }
  .ch span { color: var(--muted); font-size: 12.5px; }
  .colorpick { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .cbtn { display: inline-flex; align-items: center; gap: 7px; border: 0; border-radius: 999px; padding: 6px 13px 6px 7px; background: rgb(var(--hl) / 0.05); cursor: pointer; }
  .cbtn[aria-pressed="true"] { background: rgb(216 180 105 / 0.2); box-shadow: inset 0 0 0 1px var(--gold); }
  .inrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .field { flex: 1; min-width: 160px; border: 0; border-radius: 10px; padding: 10px 12px; background: rgb(0 0 0 / 0.35); color: var(--ink); box-shadow: inset 0 0 0 1px rgb(var(--hl) / 0.12); font-size: 15px; }
  input[type=range] { flex: 1; accent-color: var(--gold); }
  .rangev { font: 600 18px var(--display); color: var(--gold2); min-width: 2ch; }
  .review { flex: none; max-height: 82%; overflow-y: auto; margin: 6px auto 0; width: min(100%, 760px); padding: 20px 24px; border-radius: 16px; box-sizing: border-box; display: grid; gap: 14px;
    background: linear-gradient(180deg, rgb(28 24 56 / 0.94), rgb(14 12 30 / 0.96)); box-shadow: inset 0 0 0 1px rgb(216 180 105 / 0.3), 0 20px 50px -25px #000; animation: rise 0.6s ease both; }
  .review .epi { font: italic 19px/1.55 var(--serif); margin: 0; text-align: center; }
  .gauges { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
  .gauge { display: grid; justify-items: center; gap: 4px; cursor: help; }
  .gauge svg { width: 78px; height: 78px; }
  .gauge .bg { fill: none; stroke: rgb(var(--hl) / 0.08); stroke-width: 6; }
  .gauge .fg { fill: none; stroke-width: 6; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
  .gauge text { font: 600 19px var(--display); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
  .gauge span { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .path { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; justify-content: center; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .center { text-align: center; }
  .boot { display: grid; justify-items: center; gap: 12px; padding-top: 30px; color: var(--muted); text-align: center; }

  /* tooltip, help, toast */
  .tip { position: fixed; z-index: 100; max-width: 310px; padding: 10px 12px; border-radius: 12px; pointer-events: none; font-size: 12.5px; line-height: 1.45;
    background: linear-gradient(180deg, rgb(30 26 58 / 0.97), rgb(18 15 38 / 0.97)); color: var(--ink); backdrop-filter: blur(6px);
    box-shadow: 0 0 0 1px rgb(216 180 105 / 0.35), 0 16px 40px -14px #000; }
  .tip h5 { margin: 0 0 4px; font: 600 13.5px var(--display); letter-spacing: 0.03em; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .tip .q { margin: 0 0 6px; font: italic 13px var(--serif); color: var(--ink2); }
  .tip table { border-collapse: collapse; width: 100%; }
  .tip td { padding: 2px 0; vertical-align: top; } .tip td:first-child { color: var(--muted); padding-right: 10px; white-space: nowrap; }
  .tip p { margin: 6px 0 0; color: var(--muted); }
  .tip .up { color: var(--ok); } .tip .down { color: var(--bad); }
  .tip .bars { display: grid; gap: 3px; margin: 4px 0 2px; }
  .tip .bars div { display: grid; grid-template-columns: 74px 1fr 34px; gap: 6px; align-items: center; font-size: 11.5px; }
  .tip .bars i { display: block; height: 6px; border-radius: 3px; background: rgb(var(--hl) / 0.08); overflow: hidden; }
  .tip .bars i b { display: block; height: 100%; border-radius: 3px; }
  .tip .bars span:last-child { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tip .num { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 5px; background: var(--gold); color: #1d1406; font: 700 11px var(--ui); }
  .help { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: rgb(4 3 10 / 0.7); padding: 16px; }
  .help .box { max-width: 520px; padding: 20px 24px; border-radius: 16px; background: linear-gradient(180deg, #1d1838, #120f26); box-shadow: inset 0 0 0 1px rgb(216 180 105 / 0.3); }
  .help h2 { margin: 0 0 10px; font: 600 20px var(--display); }
  .help dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; }
  .help dt { white-space: nowrap; } .help dd { margin: 0; color: var(--ink2); }
  kbd { font: 600 11px var(--ui); padding: 1px 6px; border-radius: 5px; background: rgb(var(--hl) / 0.08); box-shadow: inset 0 -1px 0 rgb(var(--hl) / 0.1); }
  .toast { position: fixed; left: 50%; bottom: 76px; translate: -50% 0; z-index: 95; padding: 8px 14px; border-radius: 10px; background: #231d45; box-shadow: 0 0 0 1px rgb(216 180 105 / 0.35);
    opacity: 0; transition: opacity 0.25s; pointer-events: none; }
  .toast.on { opacity: 1; }

  /* modes */
  .app[data-mode="menu"] .hud, .app[data-mode="custom"] .hud, .app[data-mode="name"] .hud, .app[data-mode="boot"] .hud { display: none; }
  .app[data-mode="menu"] main, .app[data-mode="custom"] main, .app[data-mode="name"] main, .app[data-mode="boot"] main { grid-template-columns: minmax(0, 1fr); }
  .app[data-mode="menu"] .chron, .app[data-mode="custom"] .chron, .app[data-mode="name"] .chron, .app[data-mode="boot"] .chron { display: none; }

  /* ---------- narrower screens ---------- */
  @media (max-width: 1040px) {
    main { grid-template-columns: minmax(0, 1fr); }
    .hud { position: fixed; top: 0; right: 0; bottom: 0; width: min(330px, 90vw); z-index: 80; padding: 16px 16px 24px; box-sizing: border-box;
      background: linear-gradient(180deg, #16122e, #0c0a1a); box-shadow: -20px 0 50px -20px #000; transform: translateX(105%); transition: transform 0.3s ease; }
    .hud.open { transform: none; }
    .hud-toggle, .hud .hud-close { display: inline-flex; }
  }
  @media (max-width: 1180px) {
    .tbtn .t { display: none; } .hud-toggle .t { display: inline; }
    .who .crest .gn { max-width: 16ch; }
  }
  @media (max-height: 780px) {
    :root { --cw: 150px; --ch: 210px; }
    .line { height: 96px; margin-bottom: 6px; }
    .cpm { padding: 12px 18px 11px; } .cpm .scene { font-size: 16.5px; margin-top: 6px; } .mh h2 { font-size: 19px; }
    .cpm .note { font-size: 14.5px; }
    .chron { min-height: 56px; }
    .table { gap: 6px; }
    .mtg .art { height: 50px; }
    .mtg .tx .ru { font-size: 11.4px; }
  }
  @media (max-width: 640px) {
    :root { --cw: 150px; --ch: 214px; }
    .app { padding-inline: 10px; }
    .bar { gap: 8px; }
    .brand, .tbtn .t, .tbtn .v, .who .crest .gn, .who .age small, #tHelp, .live { display: none; }
    .tools { gap: 0; } .tbtn { padding: 6px 7px; }
    .who { gap: 8px; } .who .nm { font-size: 15px; max-width: 28vw; overflow: hidden; text-overflow: ellipsis; }
    .transport { flex-wrap: nowrap; gap: 8px; } .primary { padding: 9px 12px; }
    .line { height: 88px; margin-bottom: 6px; }
    .chron { padding: 2px 6px 16px 32px; }
    .en { font-size: 15.5px; } .yr .lead { font-size: 15px; }
    .en .gut { left: -28px; width: 20px; height: 20px; font-size: 12px; }
    .cpm { padding: 12px 14px; } .cpm .scene { font-size: 16px; } .mh h2 { font-size: 18px; }
    .steps4 button { padding: 5px 4px; gap: 3px; }
    .live .t, .handnote span:nth-child(3) { display: none; }
    .hero h1 { font-size: 28px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* ================= v3 (Emren 2026-10-05 09:25): readable dark ink on parchment, the choice as a pop-up event window,
     percentages and words instead of raw numbers ================= */
  .paper {
    --ink: #1f1a14; --ink2: #3d3327; --muted: #6c5d48; --faint: #9d8c70; --line: #d2c09a;
    --gold: #8c6919; --gold2: #6b4f10; --gold3: #a8884a;
    --arcane: #5641b0; --arcane2: #6955c6; --arcane3: #ddd4f6;
    --ok: #22703b; --bad: #a9381c;
    --cW: #8f7116; --cU: #1c5ca2; --cB: #4e3966; --cR: #b03c1d; --cG: #22733e;
    --sat: #a17812; --peace: #157a74; --stress: #b64326; --want: #6849bf;
    --heart: #b83256; --head: #5040b8;
    --hl: 92 66 24;
    --paper: #f4ecda; --paper2: #eadfc5; --edge: #b39555;
    color: var(--ink);
  }
  .paper ::selection { background: #e7d39e; }
  .paper * { scrollbar-color: #c7b48a transparent; }
  main { gap: 18px; }
  .stage.paper, .hud.paper {
    background:
      radial-gradient(120% 80% at 0% 0%, rgb(255 252 240 / 0.7), transparent 60%),
      radial-gradient(90% 70% at 100% 100%, rgb(196 160 96 / 0.18), transparent 70%),
      linear-gradient(180deg, var(--paper), var(--paper2));
    border-radius: 6px;
    box-shadow: 0 0 0 1px #6b5226, 0 0 0 3px rgb(216 180 105 / 0.22), 0 26px 60px -30px #000, inset 0 0 70px rgb(150 110 40 / 0.16); }
  .stage.paper { padding: 4px 0 0; }
  .hud.paper { padding: 14px 16px 18px; }
  .chron { -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 18px); mask-image: linear-gradient(180deg, transparent 0, #000 18px); }
  .paper .en { font-size: 17px; line-height: 1.62; color: var(--ink); }
  .paper .en.minor { font-size: 15.5px; color: var(--ink2); }
  .paper .yr .lead { font-size: 16px; color: var(--ink2); }
  .paper .en.moment { font-size: 16px; color: var(--ink2); }
  .paper .en.choice { background: linear-gradient(90deg, rgb(140 105 25 / 0.08), rgb(140 105 25 / 0.02)); }
  .paper .en.loss .gut, .paper .en.death .gut { color: #5b4585; background: rgb(91 69 133 / 0.12); }
  .paper .en.goal .gut { color: var(--arcane); background: rgb(86 65 176 / 0.1); }
  .paper .en.start { color: var(--gold); }
  .paper .mk-p { color: var(--gold2); font-weight: 500; }
  .paper .mk-a { color: #3a2c16; text-decoration-color: var(--gold3); }
  .paper .mk-o { color: #3a2c16; text-decoration-color: var(--gold3); }
  .paper .mk-t { color: #45386e; }
  .paper .mk-a.c-W, .paper .mk-v.c-W, .paper .mk-o.c-W, .paper .mk-t.c-W { color: var(--cW); text-decoration-color: rgb(143 113 22 / 0.5); }
  .paper .mk-a.c-U, .paper .mk-v.c-U, .paper .mk-o.c-U, .paper .mk-t.c-U { color: var(--cU); text-decoration-color: rgb(28 92 162 / 0.5); }
  .paper .mk-a.c-B, .paper .mk-v.c-B, .paper .mk-o.c-B, .paper .mk-t.c-B { color: var(--cB); text-decoration-color: rgb(78 57 102 / 0.5); }
  .paper .mk-a.c-R, .paper .mk-v.c-R, .paper .mk-o.c-R, .paper .mk-t.c-R { color: var(--cR); text-decoration-color: rgb(176 60 29 / 0.5); }
  .paper .mk-a.c-G, .paper .mk-v.c-G, .paper .mk-o.c-G, .paper .mk-t.c-G { color: var(--cG); text-decoration-color: rgb(34 115 62 / 0.5); }
  .paper .mk-m, .paper .mk-d, .paper .mk-s, .paper .mk-k, .paper .mk-f, .paper .mk-x, .paper .mk-e, .paper .mk-r, .paper .mk-c, .paper .mk-b,
  .paper .mk-h, .paper .mk-q, .paper .mk-T, .paper .mk-R, .paper .mk-B, .paper .mk-C, .paper .mk-i, .paper .mk-g, .paper .mk-z, .paper .mk-y, .paper .mk-n {
    color: #4a3a8a; text-decoration-color: rgb(86 65 176 / 0.4); }
  .paper .lead .mk-m { color: inherit; }
  .paper .wheel .pos { stroke: #2a2116; filter: none; }
  .paper .wheel text.on { fill: var(--ink); font-weight: 700; }
  .paper .av { color: #f6eedb; }
  .paper .hud .crestbox .gn, .hud.paper .crestbox .gn { text-shadow: none; }
  .paper .hero h1 { text-shadow: none; }
  .paper .setup, .paper .review { background: linear-gradient(180deg, rgb(255 251 240 / 0.7), rgb(240 230 205 / 0.6)); box-shadow: inset 0 0 0 1px var(--line), 0 10px 30px -22px rgb(60 40 10 / 0.6); }
  .paper .field { background: #fffaf0; color: var(--ink); box-shadow: inset 0 0 0 1px var(--edge); }
  .paper .ch:hover { background: rgb(140 105 25 / 0.12); }
  .paper .ghost { color: var(--ink2); }
  .paper .primary { color: #1d1406; }
  .paper kbd { background: rgb(92 66 24 / 0.1); }
  .tip.paper { background: linear-gradient(180deg, #faf4e6, #eee3ca); color: var(--ink); backdrop-filter: none;
    box-shadow: 0 0 0 1px #8a6a2c, 0 0 0 3px rgb(216 180 105 / 0.25), 0 18px 40px -14px rgb(0 0 0 / 0.75); font-size: 13px; }
  .help .box.paper { background: linear-gradient(180deg, #f6efde, #e9ddc2); box-shadow: 0 0 0 1px #6b5226, 0 0 0 3px rgb(216 180 105 / 0.3); }
  .help .box.paper dd { color: var(--ink2); }
  .help .credits { margin-top: 14px; font-size: 12px; color: var(--muted); }

  /* states: one-word moods and circumstances */
  .states { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
  .st { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px 3px 7px; border-radius: 999px; font: 600 12.5px var(--ui); cursor: help;
    background: rgb(92 66 24 / 0.07); box-shadow: inset 0 0 0 1px rgb(92 66 24 / 0.18); color: var(--ink2); }
  .st.g1 { color: var(--ok); box-shadow: inset 0 0 0 1px rgb(34 112 59 / 0.35); background: rgb(34 112 59 / 0.07); }
  .st.g-1 { color: var(--bad); box-shadow: inset 0 0 0 1px rgb(169 56 28 / 0.35); background: rgb(169 56 28 / 0.07); }
  .chip .w { font-weight: 600; color: var(--ink); }
  .rg b.pv { font: 700 11.5px var(--ui); color: var(--ink); font-variant-numeric: tabular-nums; }

  /* ---------- the event window (a checkpoint, then what came of it) ---------- */
  .evwrap { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 18px; box-sizing: border-box;
    background: radial-gradient(ellipse at 50% 40%, rgb(12 9 26 / 0.55), rgb(4 3 10 / 0.84)); animation: fadein 0.25s ease both; }
  .evwrap.peek { display: none; }
  @keyframes fadein { from { opacity: 0; } }
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(0.985); } }
  .ev { position: relative; width: min(1120px, 100%); max-height: 100%; min-height: 0; display: grid; grid-template-columns: 440px minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto; border-radius: 8px; overflow: hidden; gap: 0; padding: 0;
    background: radial-gradient(120% 80% at 0% 0%, rgb(255 252 240 / 0.75), transparent 60%), linear-gradient(180deg, var(--paper), var(--paper2));
    box-shadow: 0 0 0 1px #5a431c, 0 0 0 4px rgb(216 180 105 / 0.4), 0 0 0 5px #24190b, 0 40px 90px -30px #000; animation: pop 0.3s cubic-bezier(.2, .8, .3, 1) both; }
  .evh { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 10px 18px; flex-wrap: wrap;
    --ink: #f3e8cb; --muted: #b9add0; --heart: #f08aa4; --head: #a99cf6; --stress: #f2856d; --faint: #6c6487; --hl: 255 255 255; --gold: #d8b469;
    background: linear-gradient(180deg, #2b2242, #161128); color: var(--ink); border-bottom: 1px solid #8a6a2c; box-shadow: inset 0 -3px 0 rgb(216 180 105 / 0.15); }
  .evh .kick { font: 600 11px var(--ui); letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .evh h2 { margin: 0; font: 600 21px/1.25 var(--display); letter-spacing: 0.03em; color: #f6ebcf; flex: 1; min-width: 14ch; text-wrap: balance; }
  .evh .stakes { display: inline-flex; gap: 1px; color: var(--stress); cursor: help; font-size: 15px; }
  .evh .stakes .off { color: var(--faint); opacity: 0.6; }
  .evl { min-height: 0; overflow-y: auto; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  .evart { position: relative; flex: none; aspect-ratio: 7 / 4; overflow: hidden; background: var(--art); border-bottom: 1px solid #5a431c; }
  .evart img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

function renderPlan(h) {

  } else if (p.step === "what") {

        <div class="verdict">${hhs}</div>
        ${people ? `<div class="verdict"><span class="muted">With</span><span class="with">${people}</span></div>` : ""}
        <div class="row2">${cmove}${toward}</div>
      </div></div>
    <div class="evr"><div class="reso-r">
      <p class="scene" data-i="res">${rich(r.text)}</p>
      ${chips ? `<div class="became">${chips}</div>` : ""}
      ${(r.states || []).length ? `<div class="states">${r.states.map((x) => `<span class="st g${x.what === "gained" ? x.good : 0}${x.what === "gained" ? "" : " gone"}">${ic(x.icon)}${x.what === "gained" ? "Now " : "No longer "}${esc(x.word)}</span>`).join("")}</div>` : ""}
      ${(r.roles || []).length ? `<div class="states">${r.roles.map((x, i) => `<span class="st rl g${x.up ? 1 : 0}${x.up ? "" : " gone"}" data-rr="${i}">${ic(roleIconOf(x))}${esc(x.up && x.title ? "Now " + x.word : cap(x.word))}</span>`).join("")}</div>` : ""}
      ${les.length ? `<div class="lesson">${ic("rune")}<div><span class="k">How the world works</span>${rich(les[0].line)}${les.slice(1, 2).map((x) => `<span class="more">${rich(x.line)}</span>`).join("")}</div></div>` : ""}
    </div></div>
    <div class="evf"><button class="primary" id="goOn">${ic("play")} Go on</button><span class="legend"><span>Hover the changes and colors for the numbers behind them</span></span>
      <button class="ghost" id="evPeek">${ic("eye")} Look at the life</button></div>`;
  showEv(true); setPeek(false);
  $("goOn").addEventListener("click", () => send(""));
  $("evPeek").addEventListener("click", () => setPeek(true));
  tableEl.querySelectorAll("[data-z]").forEach((x) => { const z = x.dataset.z.split("|"); setTip(x, () => changeTip(z[0], +z[1], +z[2])); });
  tableEl.querySelectorAll("[data-pid]").forEach((x) => setTip(x, () => personTip(+x.dataset.pid)));
  tableEl.querySelectorAll("[data-rr]").forEach((x) => { const d = r.roles[+x.dataset.rr]; setTip(x, () => roleTip(d, findRole(d.name))); });
  setTip($("cmove"), () => tipBox(`${ic("wheel")} The colors this week`, "", [["Moved", colorMoves(r.dw)]], (r.push || []).map((p) => `${esc(cap(p.why))}: ${p.dir} ${pip(p.color)}`).join("<br>") || "Points are shares of 100."));
  if ($("toward")) setTip($("toward"), () => cl ? tipBox(`${pips(lettersOf(cl.identity))} Moving toward ${esc(cl.guild)}`, "", [["Still to go", `${(cl.distance * 100).toFixed(1)} pts`]], "A color crossing an even share (20%) joins or leaves who they are.") : tipBox(`${pips(nowC)} ${esc(r.identity.guild)}`, "", [], "No identity is close to changing this week."));
  tableEl.querySelectorAll(".verdict .tag").forEach((x) => setTip(x, () => tipBox(`${ic("voice")} Heart and head`, "", [], x.classList.contains("push") ? "You chose for them. If they were okay with it, it cost little; the less they wanted it, the more it cost: effort, strain and pent-up wanting." : x.classList.contains("regret") ? "The heart won against the head, and it failed. Regret lingers, and it can bring back what was let go." : "Before the choice, the heart (impulse) and the head (reflection) each had a favourite. This is which one they followed.")));
}

/* ---------------- menu, setup ---------------- */
function presetCard(p, i) {
  const cs = p.colors || [];
  const setting = SETTING_NAME[p.setting] || "Your own world";
  const glyph = cs.length ? cs.slice(0, 2).map((c, j) => `<svg class="big${cs.length > 1 ? " two" : ""}" style="${cs.length > 1 ? `left:${j ? 66 : 34}%` : ""}"><use href="#${MANA(c)}"/></svg>`).join("") :
    ((si) => `<svg class="big" style="${isGi(si) ? "fill:rgb(255 255 255 / .45);stroke:none" : "fill:none;stroke:rgb(255 255 255 / .45);stroke-width:1.3"}">${useIc(si, "")}</svg>`)(SETTING_ICON[p.setting] || "sliders");
  return `<button class="mtg pc" data-k="${p.k}" style="--n:${i};--frame:${p.setting === "custom" ? "linear-gradient(160deg,#ecd087,#a07a2c 55%,#e0bd6a)" : frameBG([...new Set(cs)])};--art:${cs.length ? artBG(cs) : "radial-gradient(circle at 50% 60%, #8a7fc0, #1a1530)"};--tint:${cs.length ? ART[cs[0]][0] : "#ddd"}">
    <span class="fr"><span class="nl"><span class="nm">${esc(p.title.replace(/ \((tribal|a world of magic)\)$/, ""))}</span>${pips(cs)}</span>
      <span class="art"><span class="stars"></span>${glyph}</span>
      <span class="tl"><span class="ty">Life — ${esc(setting)}</span>${ic(SETTING_ICON[p.setting] || "globe")}</span>
      <span class="tx"><span class="ru">${esc(p.blurb)}</span></span>
      <span class="ft"><span class="no">№ ${p.k}</span><span class="pt">${p.age === null ? "?" : p.age === 0 ? "birth" : p.age}</span></span></span></button>`;
}
function renderScreen(h) {
  if (h.mode === "menu") {
    screenEl.innerHTML = `<div class="hero"><h1>CHROMA</h1><div class="pips">${COLORS.map((c) => pip(c)).join("")}</div><p>One life. Five colors. You are the voice in their head.</p></div>
      <div class="presets">${h.menu.map(presetCard).join("")}</div><p class="muted center" style="margin-top:14px">Choose where a life begins. The number on a card is its key; the corner says when you take over.</p>`;
    screenEl.querySelectorAll(".pc").forEach((b) => b.addEventListener("click", () => send(b.dataset.k)));
    return;
  }
  if (h.mode === "custom" || h.mode === "name") {
    const s = h.step;
    let body = "";
    if (s.kind === "choice") body = `<div class="choices">${s.choices.map(([v, t, d]) => `<button class="ch" data-v="${v}"><b>${esc(t)}</b>${d ? `<span>${esc(d)}</span>` : ""}</button>`).join("")}</div>`;
    else if (s.kind === "colors") body = `<div class="colorpick">${COLORS.map((c) => `<button class="cbtn" data-c="${c}" aria-pressed="false">${pip(c)}<span>${CNAME[c]}</span></button>`).join("")}</div><div class="inrow"><button class="primary" id="go">${ic("push")} Next</button></div>`;
    else if (s.kind === "number") body = `<div class="inrow"><input type="range" id="num" min="0" max="60" step="1" value="0" aria-label="age"><span class="rangev" id="numv">0</span></div><div class="inrow" style="margin-top:12px"><button class="primary" id="go">${ic("push")} Next</button></div>`;
    else body = `<div class="inrow"><input class="field" id="txt" type="text" maxlength="24" autocomplete="off" spellcheck="false" placeholder="${s.key === "name" ? "a name, or leave empty" : "leave empty for random"}"><button class="primary" id="go">${ic(h.mode === "name" ? "play" : "push")} ${h.mode === "name" ? "Begin" : "Next"}</button></div>`;
    screenEl.innerHTML = `<div class="setup">${s.n > 1 ? `<div class="steps">${Array.from({ length: s.n }, (_, i) => `<b class="${i <= s.i ? "on" : ""}"></b>`).join("")}</div>` : ""}
      <div class="ttl">${esc(s.title.replace(/ \((tribal|a world of magic)\)$/, ""))}${s.n > 1 ? ` · step ${s.i + 1} of ${s.n}` : ""}</div><h2>${esc(s.q)}</h2>${s.hint ? `<p class="hint">${esc(s.hint)}</p>` : ""}${body}</div>`;
    screenEl.querySelectorAll(".ch").forEach((b) => b.addEventListener("click", () => send(b.dataset.v)));
    screenEl.querySelectorAll(".cbtn").forEach((b) => b.addEventListener("click", () => b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true")));
    const num = $("num"); if (num) num.addEventListener("input", () => { $("numv").textContent = num.value; });
    const txt = $("txt"), go = $("go");
    if (go) go.addEventListener("click", () => {
      if (s.kind === "colors") send([...screenEl.querySelectorAll('.cbtn[aria-pressed="true"]')].map((b) => b.dataset.c).join(""));
      else if (s.kind === "number") send(num.value);
      else send(txt.value.trim());
    });
    if (txt) { txt.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); go.click(); } }); setTimeout(() => txt.focus({ preventScroll: true }), 30); }
    return;
  }
  screenEl.innerHTML = "";
}

/* ---------------- the end of a life ---------------- */
function gauge(v, label, color, help) {
  const r = 31, C = 2 * Math.PI * r;
  return `<div class="gauge" data-help="${esc(help)}"><svg viewBox="0 0 78 78" aria-hidden="true"><circle class="bg" cx="39" cy="39" r="${r}"/><circle class="fg" cx="39" cy="39" r="${r}" stroke="${color}" stroke-dasharray="${(clamp(v) * C).toFixed(1)} ${C.toFixed(1)}"/><text x="39" y="40">${Math.round(v * 100)}</text></svg><span>${label}</span></div>`;
}
const GUILD_COL = { "mono-White": "W", "mono-Blue": "U", "mono-Black": "B", "mono-Red": "R", "mono-Green": "G", Azorius: "WU", Dimir: "UB", Rakdos: "BR", Gruul: "RG", Selesnya: "WG",
  Orzhov: "WB", Izzet: "UR", Golgari: "BG", Boros: "WR", Simic: "UG", Bant: "WUG", Esper: "WUB", Grixis: "UBR", Jund: "BRG", Naya: "WRG", Abzan: "WBG", Jeskai: "WUR",
  Sultai: "UBG", Mardu: "WBR", Temur: "URG" };
function pathHTML(path) {
  const chip = (g) => `<span class="chip">${GUILD_COL[g] ? pips(GUILD_COL[g].split("")) : ""}${esc(g)}</span>`;
  const join = (xs) => xs.map(chip).join(`<span class="muted">›</span>`);
  if (path.length <= 12) return join(path);
  return join(path.slice(0, 5)) + `<span class="muted">› … ${path.length - 11} more ›</span>` + join(path.slice(-6));
}
function renderReview(h) {
  const r = h && h.review;
  if (!h || h.mode !== "over" || !r) { reviewEl.hidden = true; reviewEl.innerHTML = ""; return; }
  if (!reviewEl.hidden) return;
  reviewEl.hidden = false;
  reviewEl.innerHTML = `<div class="mh" style="justify-content:center"><span class="kick">${ic("candle")} The end of a life</span></div>
    <p class="epi" data-i="review">${rich(r.epitaph)}</p>
    <div class="gauges">${gauge(r.fulfilment, "Fulfilment", "var(--sat)", "Satisfaction through adulthood.")}${gauge(r.serenity, "Serenity", "var(--peace)", "Peace through adulthood.")}${gauge(r.integrity, "Integrity", "var(--gold)", "How much they lived by their own wants: pushing them against their will lowers it.")}</div>
    <div class="center"><div class="muted" style="margin-bottom:6px">Identities lived · ${r.paths}</div><div class="path">${pathHTML(r.path)}</div></div>
    <div class="muted center">${r.own} moments left to them · ${r.forced} pushed by you · ended as ${esc(r.final)}</div>
    <div class="center"><button class="primary" id="again">${ic("new")} A new life</button></div>`;
  reviewEl.querySelectorAll(".gauge").forEach((g) => setTip(g, () => tipBox(g.querySelector("span").textContent, "", [], g.dataset.help)));
  $("again").addEventListener("click", () => send(""));
}

/* ---------------- transport ---------------- */
function renderTransport() {
  const h = hud;
  if (!h || !["play", "over"].includes(h.mode)) { transEl.innerHTML = ""; return; }
  const L = h.life || {};
  const atCp = !!h.cp && !busy, over = h.mode === "over", atRes = !h.cp && !!h.res && !busy;
  let main;
  if (busy) main = `<button class="primary" id="tPause">${ic("pause")} Pause</button>`;
  else if (over) main = `<button class="primary" id="tMain">${ic("new")} New life</button>`;
  else if (atCp) main = `<button class="primary" id="tMain">${ic("crown")} <span>Let ${esc(narrow() ? "them" : L.name || "them")} choose</span></button>`;
  else if (atRes) main = `<button class="primary" id="tMain">${ic("play")} Go on</button>`;
  else main = `<button class="primary" id="tMain">${ic("play")} Live on</button>`;
  const dis = busy || atCp || over ? "disabled" : "";
  transEl.innerHTML = `${main}
    <span class="steps4" role="group" aria-label="Step forward">${[["w", "1w", "one week"], ["m", "1m", "one month"], ["y", "1y", "one year"], ["d", "10y", "ten years"]].map(([k, t, d]) => `<button data-key="${k}" data-d="${d}" ${dis}>${ic("step")}${t}</button>`).join("")}</span>
    <span class="live">${busy ? `<span class="spin"></span><span>Living… <span class="t">age</span> ${L.age != null ? L.age.toFixed(1) : ""}</span>` : atCp ? `<span>${ic("flag")} <span class="t">A moment is waiting: choose for them, or let them choose.</span></span>` : over ? "" : atRes ? `<span>${ic("rune")} <span class="t">What came of the choice. Go on when ready.</span></span>` : `<span class="t">Live on to the next moment, or step through time.</span>`}</span>`;
  const tm = $("tMain"); if (tm) tm.addEventListener("click", () => send(""));
  if (tm && atCp) { const own = h.cp.options.find((o) => o.own); setTip(tm, () => tipBox(`${ic("crown")} Their own choice`, own ? esc(cap(own.label)) : "", [], "They act as they lean, with no reluctance cost. Key Enter.")); }
  const tp = $("tPause"); if (tp) tp.addEventListener("click", pause);
  transEl.querySelectorAll(".steps4 button").forEach((b) => { b.addEventListener("click", () => send(b.dataset.key)); setTip(b, () => tipBox(`${ic("step")} Step ${b.dataset.d}`, "", [], "Stops early at a moment. Keys w, m, y, d.")); });
}

/* ---------------- help ---------------- */
function openHelp() {
  hideTip();
  helpEl.hidden = false;
  helpEl.innerHTML = `<div class="box paper"><h2>Keys</h2><dl>
    <dt><kbd>Enter</kbd></dt><dd>Live on to the next moment; at a moment, let them choose</dd>
    <dt><kbd>1</kbd>…<kbd>11</kbd></dt><dd>Push them to that option</dd>
    <dt><kbd>w</kbd> <kbd>m</kbd> <kbd>y</kbd> <kbd>d</kbd></dt><dd>Step a week, a month, a year, ten years</dd>
    <dt><kbd>Esc</kbd></dt><dd>Pause while time runs</dd>
    <dt><kbd>f</kbd></dt><dd>How often moments stop for you</dd>
    <dt><kbd>v</kbd></dt><dd>How much of daily life the story tells</dd>
    <dt><kbd>l</kbd></dt><dd>Ledger: the numbers under the story</dd>
    <dt><kbd>p</kbd></dt><dd>Dreams and plans: make a plan for them, or drop one</dd>
    <dt><kbd>n</kbd></dt><dd>A new life</dd>
    <dt><kbd>h</kbd></dt><dd>This help</dd></dl>
    <p class="muted" style="margin:12px 0 0">Before each choice, the inner voice says what the heart (${ic("heart")}) and the head (${ic("head")}) want; after it, a page shows what came of it and how the world works. Colored words in the story can be hovered (or tapped): people, acts, thoughts and values show what the engine did behind them. The line at the top is the whole life; the fog is the part not yet lived.</p>
    ${GI_DATA.credit ? `<p class="muted credits">Icons from <a href="${GI_DATA.credit.source}" target="_blank" rel="noopener">${esc(GI_DATA.credit.source.replace(/^https?:\/\//, ""))}</a> by ${esc((GI_DATA.credit.authors || []).join(", "))}, under <a href="${GI_DATA.credit.license_url}" target="_blank" rel="noopener">${esc(GI_DATA.credit.license)}</a>.</p>` : ""}
    <div class="center" style="margin-top:12px"><button class="ghost" id="helpClose">${ic("x")} Close</button></div></div>`;
  $("helpClose").addEventListener("click", closeHelp);
}
helpEl.addEventListener("click", (e) => { if (e.target === helpEl) closeHelp(); });
function closeHelp() { helpEl.hidden = true; helpEl.innerHTML = ""; }

/* ---------------- state ---------------- */
let hudDrawn = 0;
function applyState(m) {
  busy = !!m.busy; hud = m.hud;
  const prev = app.dataset.mode;
  app.dataset.mode = hud.mode;
  if (prev !== hud.mode && !["play", "over"].includes(hud.mode)) hudEl.classList.remove("open");
  if (hud.mode === "menu" && prev !== "menu") { resetChron(); reviewEl.hidden = true; }
  addFeed(m.feed);
  renderWho(hud.life);
  renderTools(hud);
  if (["menu", "custom", "name"].includes(hud.mode)) { if (!busy) renderScreen(hud); } else screenEl.innerHTML = "";
  const t = performance.now();
  if (!busy || t - hudDrawn > 280) { if (hud.life && hud.life.w) renderHud(hud.life); drawLine(); hudDrawn = t; }
  renderTable(hud);
  renderPlan(hud);
  renderReview(hud);
  renderTransport();
  lockInputs(busy);
  if (hud.note) toast(hud.note.startsWith("error") ? hud.note : hud.note + ".");
  if (!busy && (hud.cp || hud.res) && stick.bottom) chronEl.scrollTop = chronEl.scrollHeight;
}

document.addEventListener("keydown", (e) => {
  if (!helpEl.hidden) { if (e.key === "Escape" || e.key === "h") closeHelp(); return; }
  if (e.target.closest("input, textarea")) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "Escape") { if (busy) pause(); else if (hud && hud.plan) send("x"); hideTip(); hudEl.classList.remove("open"); return; }
  if (!hud || busy) return;
  const mode = hud.mode;
  if (mode === "menu") { if (hud.menu.some((p) => p.k === e.key)) send(e.key); return; }
  if (!["play", "over"].includes(mode)) return;
  if (hud.plan && e.key !== "Enter" && e.key !== "x" && e.key !== "Escape") { if (/^[1-5]$/.test(e.key)) send(e.key); return; }
  if (e.key === "Enter") { if (e.target.closest("button")) return; e.preventDefault(); send(""); return; }
  if (e.key === "h" || e.key === "?") { openHelp(); return; }
  if (/^[0-9]$/.test(e.key) && hud.cp) {
    const max = hud.cp.options.length;
    digitBuf += e.key; clearTimeout(digitTimer);
    const fire = () => { const n = +digitBuf; digitBuf = ""; const o = hud.cp.options.find((x) => x.n === n); if (o) send(o.own ? "" : String(n)); };
    if (max >= 10 && digitBuf === "1") digitTimer = setTimeout(fire, 450); else fire();
    return;
  }
  if (!hud.cp && ["w", "m", "y", "d"].includes(e.key) && mode === "play") { send(e.key); return; }
  if (["f", "v", "l", "n", "p"].includes(e.key)) send(e.key);
  if (e.key === "x" && hud.plan) send("x");
});

function fatal(msg) {
  app.dataset.mode = "boot";
  screenEl.innerHTML = `<div class="boot"><div class="hero"><h1>CHROMA</h1></div><p>Could not start: ${esc(msg)}</p><p>This page runs the real engine (Python and numpy) inside your browser with WebAssembly. If the browser or this viewer blocks that, the same game runs in a terminal: python3 play.py in the project's chroma-game/prototype folder (needs Python 3 and numpy).</p></div>`;
}
screenEl.innerHTML = `<div class="boot"><div class="hero"><h1>CHROMA</h1><div class="pips">${COLORS.map((c) => pip(c)).join("")}</div></div><span class="spin"></span><span id="bootMsg">Loading Python and numpy in your browser (about 16 MB the first time)…</span></div>`;
drawLine();
const watchdog = setTimeout(() => { if (!ready) fatal("the Python runtime did not start within 90 seconds."); }, 90000);
try {
  worker = new Worker(new URL("worker.js", location.href).href);
  worker.onmessage = (e) => {
    const m = e.data;
    if (m.kind === "state") { if (!ready) { ready = true; clearTimeout(watchdog); } applyState(m); }
    else if (m.kind === "sys") { if (!ready) { const b = $("bootMsg"); if (b) b.textContent = m.text; } else { busy = false; toast(m.text); renderTransport(); lockInputs(false); } }
    else if (m.kind === "fatal") { clearTimeout(watchdog); fatal(m.msg); }
  };
  worker.onerror = (e) => { clearTimeout(watchdog); fatal(e.message || "the engine worker failed to load."); };
} catch (e) { clearTimeout(watchdog); fatal(e.message || String(e)); }
</script>
</body></html>
