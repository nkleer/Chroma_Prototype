  /* point 10: tarot cards and the reading */
  .spread { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; width: min(1240px, 100%); margin: 0 auto; }
  .spread #reading { width: min(680px, 100%); margin: 0 auto; }
  .tarots { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 1180px) { .tarots { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .tarot { position: relative; padding: 10px 10px 12px; border: 0; border-radius: 10px; cursor: pointer; display: grid; grid-template-rows: auto auto auto auto; gap: 8px; align-content: start;
    justify-items: center; color: #f3e8cb; text-align: center; box-sizing: border-box;
    background: linear-gradient(180deg, #2b2242, #161128); box-shadow: 0 0 0 1px #8a6a2c, inset 0 0 0 5px #1d1733, inset 0 0 0 6px rgb(216 180 105 / 0.55), 0 14px 30px -14px #000;
    transition: transform 0.25s cubic-bezier(.2, .8, .3, 1), box-shadow 0.25s; animation: rowin 0.5s ease both; animation-delay: calc(var(--n, 0) * 70ms); }
  .tarot:hover, .tarot:focus-visible, .tarot.sel { transform: translateY(-8px); outline: none; box-shadow: 0 0 0 1.5px var(--gold), inset 0 0 0 5px #1d1733, inset 0 0 0 6px var(--gold), 0 22px 36px -14px #000, 0 0 30px -6px rgb(216 180 105 / 0.55); }
  .tarot .tn { font: 600 var(--fs-2) var(--display); letter-spacing: 0.2em; color: #f4dfa6; padding-top: 4px; }
  .tarot .tp { position: relative; width: 100%; aspect-ratio: 7 / 10; border-radius: 4px; overflow: hidden; background: var(--art); box-shadow: 0 0 0 1px rgb(216 180 105 / 0.45); }
  .tarot .tp img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tarot .tg { position: absolute; inset: 0; display: grid; place-items: center; font-size: 48px; color: rgb(255 255 255 / 0.55); }
  .tarot .tt { font: 600 var(--fs-2)/1.2 var(--display); letter-spacing: 0.04em; text-wrap: balance; min-height: 2.4em; display: grid; place-items: center; }
  .tarot .tc .pips { font-size: var(--fs-1); }
  .tarot:disabled { cursor: default; }
  .reading { padding: 18px 20px; border-radius: 8px; display: grid; gap: 10px; align-content: start;
    background: linear-gradient(180deg, rgb(255 251 240 / 0.75), rgb(240 230 205 / 0.65)); box-shadow: inset 0 0 0 1px var(--line), 0 10px 30px -22px rgb(60 40 10 / 0.6); }
  .reading .rk { font: 600 var(--fs-1) var(--ui); letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); display: inline-flex; gap: 6px; align-items: center; }
  .reading h2 { margin: 0; font: 600 var(--fs-4)/1.25 var(--display); text-wrap: balance; }
  .reading p { margin: 0; font: 400 var(--fs-3)/1.55 var(--serif); color: var(--ink2); }
  .reading dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: var(--fs-2); }
  .reading dt { color: var(--muted); } .reading dd { margin: 0; color: var(--ink); }
  .reading .primary { justify-self: start; margin-top: 4px; }
  .reading.empty p { font-style: italic; }
  @media (min-width: 900px) {      /* a wide reading: the story on the left, the facts and Begin on the right, so Begin sits above the fold */
    .spread #reading { width: min(980px, 100%); }
    .reading:not(.empty) { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); grid-template-areas: "rk dl" "h2 dl" "p btn"; column-gap: 32px; }
    .reading .rk { grid-area: rk; } .reading h2 { grid-area: h2; } .reading p { grid-area: p; }
    .reading dl { grid-area: dl; align-self: start; } .reading .primary { grid-area: btn; align-self: end; margin-top: 0; }
  }
  .menufoot { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 18px 0 6px; }
  @media (max-width: 900px) {
    .spread { grid-template-columns: minmax(0, 1fr); }
    .shg { grid-template-columns: minmax(0, 1fr); }
    .ilcard { grid-template-columns: minmax(0, 1fr); }
    .ilside { grid-row: 2; } .ilside svg.wheel { max-width: 170px; }
  }
  @media (max-width: 640px) {
    .tarots { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .tarot { padding: 7px 7px 9px; gap: 5px; }
    .tarot .tt { font-size: var(--fs-1); }
    .tarot.zero { grid-column: 1 / -1; grid-template-columns: 38% minmax(0, 1fr); grid-template-rows: auto auto; align-items: center; column-gap: 12px; }
    .tarot.zero .tp { grid-column: 1; grid-row: 1 / 3; aspect-ratio: 4 / 3; }
    .tarot.zero .tn, .tarot.zero .tt { grid-column: 2; }
    .tarot.zero .tn { align-self: end; } .tarot.zero .tt { align-self: start; min-height: 0; font-size: var(--fs-2); }
    .ilpic { aspect-ratio: 16 / 8; }
    .sheet.box { padding: 14px; }
  }
  /* the Book of Moments and the peace reading (Emren chose "Book and peace", 21:44) */
  .bhd { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
  .bhd > svg { width: 30px; height: 30px; color: var(--gold); flex: none; }
  .bstats { display: flex; flex-wrap: wrap; gap: 10px 26px; padding: 12px 0 4px; }
  .bst { display: grid; grid-template-columns: auto auto; align-items: baseline; column-gap: 6px; cursor: help; }
  .bst b { font: 600 var(--fs-4) var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }
  .bst .of { font-size: var(--fs-1); color: var(--muted); }
  .bst .bl { grid-column: 1 / -1; font: 500 var(--fs-1) var(--ui); letter-spacing: 0.06em; color: var(--muted); }
  .brow { display: grid; gap: 1px; padding: 4px 0; border-bottom: 1px dashed rgb(var(--hl) / 0.08); font-size: var(--fs-2); }
  .brow .bn { color: var(--ink); display: inline-flex; gap: 6px; align-items: center; }
  .brow .bn svg, .bnew svg { color: var(--gold); }
  .brow .muted { font-size: var(--fs-1); }
  .bids { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 8px; }
  .bid { display: flex; align-items: center; gap: 5px; font-size: var(--fs-1); color: var(--faint); cursor: help; min-width: 0; }
  .bid > span:not(.pips):not(.bn2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bid .pips { opacity: 0.35; filter: grayscale(1); flex: none; }
  .bid.on { color: var(--ink); } .bid.on .pips { opacity: 1; filter: none; }
  .bid .bn2 { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chip.bdeed, .chip.off { opacity: 0.45; } .chip.bdeed.on { opacity: 1; color: var(--ink); }
  .chip b { font-weight: 600; color: var(--muted); }
  .chip.rare { color: var(--ink); box-shadow: inset 0 0 0 1px rgb(216 180 105 / 0.5); } .chip.rare svg { color: var(--gold); }
  .blife .bn { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
  .blife .rd { font: italic var(--fs-2) var(--serif); color: var(--ink2); }
  .bempty { margin: 18px 0 6px; font: italic var(--fs-3)/1.55 var(--serif); color: var(--ink2); max-width: 60ch; }
  .review .peace { display: grid; justify-items: center; gap: 4px; }
  .review .peace .kick { font: 600 var(--fs-1) var(--ui); letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); display: inline-flex; align-items: center; gap: 6px; }
  .review .pw { margin: 0; font: 600 var(--fs-4)/1.35 var(--display); text-align: center; text-wrap: balance; }
  .review .pnote { font-size: var(--fs-1); max-width: 58ch; margin: 0 auto; }
  .review .pls { margin: 4px auto 0; max-width: 58ch; text-align: center; font: italic var(--fs-2)/1.4 var(--serif); color: var(--ink2); text-wrap: balance; }
  .review .pls svg { vertical-align: -0.12em; margin-right: 5px; }
  .review .pls.made { color: var(--ink); }
  .review .pls svg, .tag.lshot svg { color: var(--gold); flex: none; }
  .review .bnew { font-size: var(--fs-2); display: grid; gap: 4px; justify-items: center; }
  .review .rvb { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  /* the engine's next hand-off: seasons of change (point 6), bands and the window (point 7), own death */
  .crestbox .season { margin-top: 6px; display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: var(--fs-1); color: var(--ink); background: rgb(216 180 105 / 0.14); box-shadow: inset 0 0 0 1px rgb(216 180 105 / 0.45); cursor: help; }
  .seasonnote { margin: 0 0 6px; display: flex; gap: 6px; align-items: center; font: 600 var(--fs-1) var(--ui); letter-spacing: 0.06em; color: var(--gold3); }
  svg .bd { fill: none; stroke-width: 1.6; } svg .bd.fading { stroke: var(--gold); stroke-dasharray: 3 2.4; } svg .bd.rising { stroke: var(--gold2); opacity: 0.9; }
  svg .win { fill: none; stroke: var(--arcane); stroke-width: 6; opacity: 0.18; }
  .review .died { font: italic var(--fs-3) var(--serif); color: var(--ink2); display: flex; gap: 6px; justify-content: center; align-items: center; }

  /* ================= version 22, the new look (Visuals and UX overhaul; Emren 2026-10-07 10:19 UTC chose parchment and the
     two-column grid). One material rule: the frame (top bar, life line, transport) on night glass, the story and the
     character on parchment, cards on lighter paper with a gold edge. One easing and three durations for every motion. ========= */
  :root { --ease: cubic-bezier(.2, .7, .2, 1); --t-1: 0.14s; --t-2: 0.28s; --t-3: 0.6s;
    --glass: rgb(17 14 36 / 0.62); --glass2: rgb(26 22 52 / 0.72); --glassEdge: rgb(216 180 105 / 0.16);
    --card: linear-gradient(180deg, #fffaf0, #f3e9d2); --cardEdge: #c9b386; }

  /* ---------- the top bar: name, age, identity, three doors and one Table menu ---------- */
  .bar { position: relative; z-index: 30; margin-top: 8px; padding: 5px 8px 5px 16px; border-radius: 14px; min-height: 46px; background: var(--glass); backdrop-filter: blur(10px);
    box-shadow: inset 0 0 0 1px var(--glassEdge), 0 10px 30px -18px #000; }
  .tools { position: relative; gap: 2px; }
  .tbtn.door { font-size: var(--fs-2); padding: 6px 10px; gap: 7px; color: var(--ink2); transition: background var(--t-1), color var(--t-1); }
  .tbtn.door .t { display: inline; }
  .tbtn.door > svg.i { font-size: 17px; color: var(--gold); }
  .tbtn.door kbd { padding: 0 5px; color: var(--faint); background: transparent; box-shadow: inset 0 0 0 1px rgb(var(--hl) / 0.12); }
  #tMenu[aria-expanded="true"] { background: rgb(216 180 105 / 0.12); color: var(--gold2); }
  .savednote { display: inline-flex; align-items: center; gap: 5px; margin-right: 6px; font-size: var(--fs-1); color: var(--faint); white-space: nowrap; cursor: help; }
  .savednote > svg.i { color: var(--gold3); }
  .savednote.flash { animation: savedflash 1.8s var(--ease); }
  @keyframes savedflash { 0%, 60% { color: var(--gold2); } 100% { color: var(--faint); } }
  .tpop { position: absolute; right: 0; top: calc(100% + 8px); z-index: 92; width: 300px; padding: 6px; border-radius: 12px; box-sizing: border-box;
    background: linear-gradient(180deg, rgb(32 27 64 / 0.97), rgb(18 15 38 / 0.97)); backdrop-filter: blur(14px);
    box-shadow: 0 0 0 1px rgb(216 180 105 / 0.3), 0 24px 50px -18px #000; animation: popin var(--t-2) var(--ease) both; transform-origin: top right; }
  @keyframes popin { from { opacity: 0; transform: translateY(-4px) scale(0.98); } }
  .tpop .pk { padding: 8px 10px 3px; font: 600 var(--fs-1) var(--ui); letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold3); }
  .mrow2 { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: 0; border-radius: 8px;
    background: transparent; text-align: left; cursor: pointer; color: var(--ink2); font-size: var(--fs-2); }
  .mrow2:hover, .mrow2:focus-visible { background: rgb(var(--hl) / 0.07); color: var(--ink); outline: none; }
  .mrow2 > svg.i { color: var(--gold); font-size: 16px; }
  .mrow2 .v { font-size: var(--fs-1); color: var(--gold2); text-transform: capitalize; padding: 1px 7px; border-radius: 6px; background: rgb(var(--hl) / 0.06); }
  .mrow2:disabled { opacity: 0.45; cursor: default; }
  .transport { margin-bottom: 8px; padding: 7px 10px; border-radius: 14px; background: var(--glass); backdrop-filter: blur(10px); box-shadow: inset 0 0 0 1px var(--glassEdge); }

  /* ---------- the moment window: two columns of cards that fit without scrolling ---------- */
  .ev { width: min(1180px, 100%); grid-template-columns: 400px minmax(0, 1fr); }
  .evr { padding: 10px 14px 0; gap: 6px; }
  .ev .ask.sub { margin-top: 8px; }
  .ogrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
  .ev .evh { padding-block: 8px; } .ev .evf { padding-block: 8px; }
  .ev .evart { aspect-ratio: 16 / 9; }
  .ogrid .opt, .optlook { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; grid-template-areas: "oi body cost" "meta meta meta"; align-items: start;
    gap: 5px 10px; padding: 8px 10px 7px 9px; min-height: 0; box-sizing: border-box; border-radius: 8px; text-align: left;
    background: var(--card); box-shadow: inset 0 0 0 1px var(--cardEdge), 0 2px 5px -3px rgb(60 40 10 / 0.4); }
  .ogrid .opt { transition: transform var(--t-1) var(--ease), box-shadow var(--t-1) var(--ease); animation: cardin var(--t-2) var(--ease) both; animation-delay: calc(var(--n, 0) * 30ms); }
  @keyframes cardin { from { opacity: 0; transform: translateY(6px); } }
  .ogrid .opt:hover, .ogrid .opt:focus-visible, .ogrid .opt.sel { transform: translateY(-2px); box-shadow: inset 0 0 0 1.5px var(--gold), 0 10px 20px -10px rgb(60 40 10 / 0.55); }
  .ogrid .opt .oi, .optlook .oi { grid-area: oi; width: 38px; height: 38px; border-radius: 8px; color: var(--pInk); text-shadow: none;
    background: var(--tile, #d9cfbd); box-shadow: inset 0 0 0 1px rgb(60 40 10 / 0.3), inset 0 1px 0 rgb(255 255 255 / 0.6); }
  .ogrid .opt .oi svg, .optlook .oi svg { width: 22px; height: 22px; filter: none; }
  .ogrid .opt .oi svg.mana, .optlook .oi svg.mana { width: 20px; height: 20px; }
  .ogrid .opt .oi .no, .optlook .oi .no { right: -6px; bottom: -6px; min-width: 18px; height: 18px; border-radius: 6px; box-shadow: 0 0 0 2px #f6eedb; }
  .ogrid .opt .ocost, .optlook .ocost { grid-area: cost; font-size: var(--fs-1); padding-top: 2px; }
  .ogrid .opt .obody, .optlook .obody { grid-area: body; min-width: 0; }
  .ogrid .opt .ot, .optlook .ot { font: 500 15px/1.32 var(--serif); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-wrap: pretty; }
  .ogrid .opt .os, .optlook .os { display: none; }
  .ogrid .opt .ometa, .optlook .ometa { grid-area: meta; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; min-height: 22px; }
  .ogrid .opt .acc, .optlook .acc { display: none; }
  .mk2 { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px 1px 5px; border-radius: 999px; font: 600 var(--fs-1)/1.4 var(--ui); white-space: nowrap;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; background: rgb(92 66 24 / 0.07); color: var(--ink2); }
  .mk2.own { background: linear-gradient(180deg, #ecc97f, #c79a45); color: #1d1406; }
  .mk2.heart { color: var(--heart); background: rgb(184 50 86 / 0.08); }
  .mk2.head { color: var(--head); background: rgb(80 64 184 / 0.08); }
  .mk2.rel { color: #9d3c1d; background: rgb(182 67 38 / 0.1); }
  .mk2.law { color: var(--bad); background: rgb(169 56 28 / 0.08); }
  .mk2.lever { color: var(--arcane); background: rgb(86 65 176 / 0.08); }
  .mk2.rb.up { color: var(--ok); background: rgb(34 112 59 / 0.08); } .mk2.rb.down { color: var(--bad); }
  .ogrid .opt .odds, .optlook .odds { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; }
  .gem { display: inline-flex; align-items: center; gap: 4px; }
  .gem svg { width: 17px; height: 17px; display: block; }
  .gem .g0 { fill: none; stroke: rgb(92 66 24 / 0.16); stroke-width: 2.6; }
  .gem .g1 { fill: none; stroke: var(--gold); stroke-width: 2.6; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 8px 8px; transition: stroke-dasharray var(--t-3) var(--ease); }
  .gem b { font: 700 var(--fs-2) var(--ui); color: var(--ink); font-variant-numeric: tabular-nums; }
  .gem i { font-style: normal; font-size: var(--fs-1); } .gem i.up { color: var(--ok); } .gem i.down { color: var(--bad); }
  .opt.own { background: linear-gradient(180deg, #fff8e4, #f3e2b6); }
  .ogrid .opt.own { box-shadow: inset 0 0 0 2px var(--gold), 0 0 0 3px rgb(216 180 105 / 0.25), 0 3px 8px -3px rgb(60 40 10 / 0.4); }
  .ogrid .opt.ghost { background: linear-gradient(180deg, #f8f2e4, #eee4cd); box-shadow: inset 0 0 0 1px var(--cardEdge); }
  .ogrid .opt.ghost .ot { font-style: italic; }
  .ogrid .opt.far { background: repeating-linear-gradient(135deg, #f3ebd8 0 10px, #ece2ca 10px 12px); }
  .ogrid .optdetail { grid-column: 1 / -1; margin: 0; }
  /* Do nothing: one quiet row under the grid */
  .opt.onone { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; margin-top: 8px; padding: 7px 12px; min-height: 0;
    background: rgb(92 66 24 / 0.05); box-shadow: inset 0 0 0 1px rgb(92 66 24 / 0.18); animation: cardin var(--t-2) var(--ease) both; }
  .opt.onone:hover, .opt.onone:focus-visible { transform: none; box-shadow: inset 0 0 0 1.5px var(--gold); }
  .opt.onone > svg.i { color: var(--muted); font-size: 18px; }
  .opt.onone .ot { font: 500 var(--fs-2)/1.3 var(--serif); }
  .opt.onone .os { margin-top: 1px; }
  .opt.onone .keyn { font: 600 var(--fs-1) var(--ui); color: var(--faint); white-space: nowrap; }
  .ev.choosing .ogrid .opt.chosen { transform: translateY(-2px); }
  /* the reading strip: what the hovered card means, pinned to the foot of the cards */
  .dstrip { position: sticky; bottom: 0; z-index: 2; flex: none; margin: 8px -14px 0; padding: 8px 16px 9px; min-height: 64px; box-sizing: border-box;
    background: linear-gradient(180deg, rgb(238 226 198 / 0.97), rgb(229 214 180 / 0.98)); border-top: 1px solid var(--line); font-size: var(--fs-1); color: var(--ink2); }
  .dstrip .dt { font: 600 var(--fs-2)/1.35 var(--serif); color: var(--ink); display: flex; align-items: center; gap: 8px; }
  .dstrip .dt .num { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 5px; background: #2a2116; color: #f3e8cb; font: 700 var(--fs-1) var(--ui); }
  .dstrip.idle .dt { font: italic 400 var(--fs-2)/1.4 var(--serif); color: var(--muted); }
  .dstrip .facts { display: flex; flex-wrap: wrap; gap: 2px 14px; margin-top: 4px; line-height: 1.45; }
  .dstrip .facts > span { white-space: nowrap; }
  .dstrip .facts b { color: var(--muted); font-weight: 600; margin-right: 3px; }
  .dstrip .facts .up { color: var(--ok); } .dstrip .facts .down { color: var(--bad); } .dstrip .facts .lever { color: var(--arcane); }
  .dstrip .dhelp { margin-top: 3px; color: var(--muted); font-style: italic; }
  /* the inner voice in three lines */
  .vlines { display: grid; gap: 4px; margin-top: 2px; }
  .vline { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; font: 400 var(--fs-2)/1.4 var(--serif); }
  .vline .vi { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: rgb(var(--hl) / 0.06); }
  .vline.h .vi, .vline.hd .vi { color: var(--heart); } .vline.d .vi { color: var(--head); } .vline.o .vi { color: var(--gold); }
  .vline small { display: block; font: 600 var(--fs-1) var(--ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .vline em { color: var(--ink); }
  .ev .voicebox .insight { font-size: var(--fs-2); }

  /* ---------- the one signature motion: the chosen card rises, a gold ring, then it turns over to its verdict ---------- */
  .flyer { position: fixed; z-index: 86; pointer-events: none; perspective: 1000px; transition: opacity var(--t-2) var(--ease), transform var(--t-2) var(--ease); }
  .flyer .fin { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform var(--t-3) var(--ease); }
  .flyer .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 9px; overflow: hidden;
    background: var(--card); box-shadow: inset 0 0 0 1.5px var(--gold), 0 26px 60px -18px rgb(0 0 0 / 0.75); }
  .flyer .optlook { height: 100%; box-shadow: none; background: transparent; }
  .flyer .back { transform: rotateY(180deg); display: grid; place-items: center; align-content: center; gap: 8px; padding: 10px; text-align: center;
    background: radial-gradient(circle at 50% 35%, #fffaf0, #eadbb6); }
  .flyer .back b { font: 600 var(--fs-3)/1.3 var(--display); color: var(--ink); }
  .flyer .fseal { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; background: radial-gradient(circle at 35% 30%, #fff6dc, #d9c08a);
    box-shadow: 0 0 0 2px #5a431c; animation: stamp 0.45s 0.25s cubic-bezier(.3, 1.6, .5, 1) both; }
  .flyer .fseal.ok { color: var(--ok); } .flyer .fseal.bad { color: var(--bad); }
  .flyer .fring { position: absolute; inset: -7px; border-radius: 14px; box-shadow: 0 0 0 2px var(--gold2), 0 0 30px 6px rgb(216 180 105 / 0.45); opacity: 0;
    animation: ringon var(--t-2) 0.32s var(--ease) forwards, ringpulse 1.3s 0.7s ease-in-out infinite; }
  @keyframes ringon { to { opacity: 1; } }
  @keyframes ringpulse { 50% { box-shadow: 0 0 0 2px var(--gold), 0 0 44px 10px rgb(216 180 105 / 0.3); } }
  .flyer.flip .fin { transform: rotateY(180deg); }
  .flyer.flip .fring { animation: none; opacity: 0.6; }
  .flyer.gone { opacity: 0; transform: scale(0.96); }
  .ev.choosing .ogrid .opt.lifted { visibility: hidden; }

  /* ---------- the outcome over the story column, so the crest stays in view and moves ---------- */
  .evwrap.overstage { inset: auto; padding: 0; place-items: stretch; background: none; z-index: 60; }
  .evwrap.overstage .ev { width: 100%; height: 100%; max-height: none; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); border-radius: 6px;
    box-shadow: 0 0 0 1px #6b5226, 0 0 0 3px rgb(216 180 105 / 0.3), 0 30px 60px -30px #000; }
  .ev .verdict.vbig { margin: 0; }
  .ev .verdict.vbig .sur { font: 600 var(--fs-4)/1.25 var(--display); letter-spacing: 0.02em; }
  .ev .verdict.vbig.ok .sur { color: var(--ok); } .ev .verdict.vbig.bad .sur { color: var(--bad); }
  .ev .shiftbox { align-items: center; }
  /* a moment set aside waits as a card at the foot of the story */
  .evback { display: flex; align-items: center; gap: 12px; padding: 7px 14px 7px 7px; border: 0; border-radius: 12px; cursor: pointer; max-width: min(520px, calc(100vw - 32px));
    background: linear-gradient(180deg, #fbf4e2, #ecdfc0); color: #1f1a14; box-shadow: 0 0 0 1px #6b5226, 0 0 0 3px rgb(216 180 105 / 0.3), 0 18px 40px -16px #000;
    animation: cardin var(--t-2) var(--ease) both; text-align: left; }
  .evback:hover { filter: brightness(1.03); }
  .evback img, .evback .wg { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; flex: none; display: grid; place-items: center; background: #2b2242; color: #f4dfa6; font-size: 20px; }
  .evback .wt { min-width: 0; display: grid; }
  .evback .wt small { font: 600 var(--fs-1) var(--ui); letter-spacing: 0.14em; text-transform: uppercase; color: #8c6919; }
  .evback .wt b { font: 600 var(--fs-2)/1.3 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .evback .wgo { margin-left: 6px; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px; white-space: nowrap;
    background: linear-gradient(180deg, #ecc97f, #c79a45); color: #1d1406; font: 600 var(--fs-1) var(--ui); }

  /* ---------- the compact crest: fits 800 px, the fuller record below ---------- */
  .hud { gap: 11px; }
  .hud.paper { padding: 12px 14px 16px; }
  .hud .crestbox { gap: 2px; }
  .hud .crestbox .cpips { font-size: 17px; display: flex; justify-content: center; }
  .hud .crestbox .gn { font-size: 21px; line-height: 1.2; }
  .hud .crestbox .ep { cursor: help; text-wrap: balance; line-height: 1.35; }
  .wheelw { position: relative; }
  .hud svg.wheel { max-width: 186px; margin: -8px auto -10px; }
  .wkey { position: absolute; right: 2px; top: 0; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; cursor: help;
    font: 600 var(--fs-1) var(--ui); color: var(--muted); box-shadow: inset 0 0 0 1px rgb(var(--hl) / 0.22); }
  .wkey:hover, .wkey:focus-visible { color: var(--ink); box-shadow: inset 0 0 0 1px var(--gold); outline: none; }
  .meters { display: grid; gap: 5px; }
  .mtr { display: grid; grid-template-columns: 16px 66px minmax(0, 1fr) 38px; align-items: center; gap: 8px; cursor: help; font-size: var(--fs-1); color: var(--ink2); }
  .mtr > svg.i { color: var(--mc); font-size: 15px; }
  .mtr .mbar { position: relative; height: 6px; border-radius: 3px; background: rgb(var(--hl) / 0.1); }
  .mtr .mbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--mc); transition: width var(--t-3) var(--ease); }
  .mtr .mbar b { position: absolute; top: -3px; width: 2px; height: 12px; border-radius: 1px; background: var(--ink); opacity: 0.5; translate: -1px 0; }
  .mtr .pv { text-align: right; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .means5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding-top: 2px; }
  .mean { display: grid; justify-items: center; gap: 3px; cursor: help; color: var(--ink2); min-width: 0; }
  .mean .col { position: relative; width: 9px; height: 30px; border-radius: 5px; background: rgb(var(--hl) / 0.1); overflow: hidden; }
  .mean .col i { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 5px; background: var(--mc); transition: height var(--t-3) var(--ease); }
  .mean > svg.i { color: var(--mc); font-size: 14px; }
  .mean small { font-size: var(--fs-1); color: var(--muted); line-height: 1; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nowgoal { display: grid; grid-template-columns: 16px auto minmax(0, 1fr); align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; cursor: help;
    background: rgb(var(--hl) / 0.05); box-shadow: inset 0 0 0 1px rgb(var(--hl) / 0.12); }
  .nowgoal > svg.i { color: var(--arcane); }
  .nowgoal .k { font: 600 var(--fs-1) var(--ui); letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold3); }
  .nowgoal .nm { font: italic var(--fs-2)/1.3 var(--serif); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hmore { display: flex; flex-direction: column; gap: 16px; margin-top: 4px; padding-top: 12px; border-top: 1px solid rgb(var(--hl) / 0.14); }
  .hud .sheetbtn { margin-top: -2px; }

  /* ---------- the story page: prose with margin glyphs, the world folded into one line a year ---------- */
  .en .gut.nod { visibility: hidden; }
  .en.wline { font: 400 var(--fs-2)/1.55 var(--serif); color: var(--muted); }
  .paper .en.wline { font-size: var(--fs-2); color: var(--muted); }
  .en.wline .wk { font: 600 var(--fs-1) var(--ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold3); margin-right: 8px; }
  .en.wline .wp + .wp::before { content: "·"; margin: 0 8px; color: var(--faint); }
  .en.wline .gut { top: 1px; }
  .en.wline .mk { font-weight: inherit; text-decoration-color: rgb(var(--hl) / 0.3); }
  .yh .ag { letter-spacing: 0.1em; }

  /* ---------- the start: the spread on the night table, the life set up on the reading ---------- */
  .app[data-mode="menu"] .screen, .app[data-mode="boot"] .screen { padding-top: 2px; }
  .app[data-mode="menu"] .hero { padding: 4px 0 14px; }
  .app[data-mode="menu"] .hero h1, .app[data-mode="menu"] .hero .pips { display: none; }   /* the brand is in the top bar */
  .transport:empty { display: none; }
  .app[data-mode="menu"] .hero p { margin-top: 4px; font-size: var(--fs-2); color: var(--muted); }
  .app[data-mode="menu"] .hero .pips { margin-top: 6px; font-size: var(--fs-2); }
  .tarots.picked .tarot:not(.sel) { filter: saturate(0.75) brightness(0.82); }
  .tarots.picked .tarot:not(.sel):hover { filter: none; }
  .tarot.sel { transform: translateY(-14px); }
  .tarot.sel::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: -16px; height: 10px; border-radius: 50%; background: radial-gradient(closest-side, rgb(216 180 105 / 0.45), transparent); }
  .reading { box-sizing: border-box; padding: 16px 20px; border-radius: 10px; grid-template-areas: none !important; box-shadow: 0 0 0 1px #6b5226, 0 0 0 3px rgb(216 180 105 / 0.22), 0 18px 40px -22px #000;
    background: radial-gradient(120% 80% at 0% 0%, rgb(255 252 240 / 0.8), transparent 60%), linear-gradient(180deg, var(--paper), var(--paper2)); }
  .reading .rk, .reading h2, .reading p, .reading dl, .reading .primary { grid-area: auto !important; }
  .reading.empty { text-align: center; justify-items: center; }
  .reading .rhint { font-style: italic; color: var(--muted); }
  .reading .rtext { display: grid; gap: 8px; align-content: start; min-width: 0; }
  .reading .rgo { display: grid; gap: 10px; align-content: end; min-width: 0; }
  .reading .rgo .primary { justify-self: stretch; justify-content: center; margin: 0; padding-block: 11px; }
  .reading .rgo .spin { justify-self: center; }
  .nmrow { display: grid; gap: 5px; }
  .nmrow > span { font: 600 var(--fs-1) var(--ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
  .reading .field { background: rgb(255 255 255 / 0.6); color: var(--ink); box-shadow: inset 0 0 0 1px var(--edge, #b39555); }
  .reading .field { min-width: 0; width: 100%; box-sizing: border-box; font: 400 var(--fs-3) var(--serif); padding: 9px 12px; }
  .reading .field::placeholder { color: var(--faint); font-style: italic; }
  @media (min-width: 900px) {
    .reading.has { grid-template-columns: minmax(0, 1.5fr) minmax(220px, 1fr); column-gap: 32px; }
    .reading.has .rtext dl { margin-top: 2px; }
  }
  .bootline { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 14px; color: var(--muted); font-size: var(--fs-1); }
  .boot .bootbar { position: relative; width: min(320px, 70vw); height: 2px; border-radius: 2px; overflow: hidden; background: rgb(var(--hl) / 0.1); }
  .boot .bootbar i { position: absolute; top: 0; bottom: 0; left: -40%; width: 40%; background: linear-gradient(90deg, transparent, var(--gold), transparent); animation: sweep 1.4s ease-in-out infinite; }
  .boot .hero p { margin-top: 6px; }

  /* ---------- the interlude: one picture, lines that come and go, the year as a strip; the crest's wheel moves ---------- */
  .ilcard { grid-template-columns: minmax(0, 1fr); }
  .ilcard:has(.ilside) { grid-template-columns: minmax(0, 1fr) 190px; }
  .ilkick .ilage { letter-spacing: 0.06em; text-transform: none; color: var(--muted); font-weight: 500; }
  .illines p { animation: linein 1.2s var(--ease) both; }
  .ilseason { position: relative; flex: 1; display: flex; height: 26px; border-radius: 6px; overflow: hidden; box-shadow: inset 0 0 0 1px rgb(var(--hl) / 0.14); }
  .ilseason .sb { display: flex; align-items: center; justify-content: center; gap: 5px; font: 600 var(--fs-1) var(--ui); letter-spacing: 0.06em; color: var(--muted); min-width: 0; overflow: hidden; white-space: nowrap; }
  .ilseason .sb em { font-style: normal; }
  .ilseason .sb.winter { background: rgb(130 185 242 / 0.12); } .ilseason .sb.spring { background: rgb(127 211 148 / 0.13); }
  .ilseason .sb.summer { background: rgb(232 187 85 / 0.16); } .ilseason .sb.autumn { background: rgb(243 140 107 / 0.13); }
  .ilseason .ilmark { position: absolute; top: 2px; bottom: 2px; width: 3px; border-radius: 2px; translate: -1px 0; background: var(--gold); box-shadow: 0 0 8px var(--gold); transition: left 0.12s linear; }
  .ilseason .ilprog { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: linear-gradient(90deg, var(--gold3), var(--gold)); transition: width 0.2s linear; }
  .hud.ilon #hudWheel { filter: drop-shadow(0 0 10px rgb(216 180 105 / 0.35)); }
  .pace { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: rgb(var(--hl) / 0.04); }
  .pace button { display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; border-radius: 7px; padding: 5px 9px; cursor: pointer; color: var(--ink2); font-size: var(--fs-1); text-transform: capitalize; }
  .pace button:hover { background: rgb(var(--hl) / 0.07); }
  .pace button[aria-pressed="true"] { background: rgb(216 180 105 / 0.14); color: var(--gold2); }

  /* ---------- small panels in the same family: the end of a life, Keys, toasts ---------- */
  .paper .review { border-radius: 10px; background: radial-gradient(120% 80% at 50% 0%, rgb(255 252 240 / 0.85), transparent 60%), linear-gradient(180deg, #fbf5e6, #efe3c7);
    box-shadow: 0 0 0 1px #6b5226, 0 0 0 3px rgb(216 180 105 / 0.22), 0 18px 40px -22px #000; }
  .help .box, .help .box.paper { border-radius: 10px; }
  .toast { border-radius: 999px; padding: 8px 18px; font-size: var(--fs-2); background: var(--glass2); backdrop-filter: blur(10px); translate: -50% 6px;
    transition: opacity var(--t-2) var(--ease), translate var(--t-2) var(--ease); }
  .toast.on { translate: -50% 0; }

  /* ---------- narrower screens and the phone ---------- */
  @media (max-width: 1040px) {
    .evwrap.overstage { inset: 0; }
  }

    .ilcard:has(.ilside) { grid-template-columns: minmax(0, 1fr); }

    .ogrid { gap: 8px; }
    .dstrip { display: none; }
  }

    .savednote span { display: none; }
  }

  }

    .ogrid .opt .ot, .optlook .ot { font-size: var(--fs-3); }
    .opt.onone .keyn { display: none; }
    .pace button { padding: 5px 6px; }
    .reading { padding: 14px 14px; }
    .tarot.sel { transform: translateY(-6px); }
    .tarot.sel::after { display: none; }
    .ilseason .sb em { display: none; }
    .evback { left: 10px; right: 10px; translate: none; max-width: none; bottom: 70px; gap: 10px; }
    .evback img, .evback .wg { width: 40px; height: 40px; }

    .evback .wgo { margin-left: 0; padding: 7px 10px; font-size: 0; gap: 0; }
    .evback .wgo svg.i { font-size: 16px; }
    .ev .evf { background: linear-gradient(180deg, #e6d7b4, #dcc9a0); box-shadow: 0 -8px 16px -10px rgb(60 40 10 / 0.5); }
  }

  /* ---------- the character sheet in tabs (parts/sheet.css) ---------- */
  /* ================= v22 next look: the character sheet in tabs (parts/sheet.css; appended after "point 13") =================
     A night header like the event window's, parchment below; tabs Portrait, Colours, Inner life, Around them, Ledger.
     The box keeps one height, so switching tabs does not make it jump; the panel area scrolls inside. */
  .help .sheet.box { position: relative; width: min(1180px, 100%); max-width: none; height: min(760px, calc(100vh - 32px)); height: min(760px, calc(100dvh - 32px));
    max-height: none; display: flex; flex-direction: column; overflow: hidden; padding: 0; border-radius: 8px; box-sizing: border-box; }
  .sheet .shh { position: relative; flex: none; display: flex; align-items: center; gap: 8px 28px; flex-wrap: wrap; padding: 14px 64px 14px 24px; border-bottom: 1px solid #8a6a2c;
    --ink: #f3e8cb; --ink2: #e2d6b6; --muted: #b9add0; --faint: #948bb3; --gold: #d8b469; --gold2: #f4dfa6; --hl: 255 255 255;
    background: linear-gradient(180deg, #2b2242, #161128); color: var(--ink); box-shadow: inset 0 -3px 0 rgb(216 180 105 / 0.15); }
  .sheet .shwho { min-width: 0; }
  .sheet .shh .shn { font: 600 var(--fs-4)/1.2 var(--display); letter-spacing: 0.02em; color: #f6ebcf; }
  .sheet .shh .muted { color: var(--muted); font-size: var(--fs-2); }
  .sheet .shh .shid { flex: 1 1 280px; min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
  .sheet .shh .shid > div { min-width: 0; max-width: 48ch; }
  .sheet .shh .shid .pips { font-size: var(--fs-3); flex: none; }
  .sheet .shh .shid b { font: 600 var(--fs-3) var(--display); color: var(--gold2); }
  .sheet .shh .shid .muted { font-size: var(--fs-1); line-height: 1.35; }
  .sheet .shh .shid .mg { font-size: var(--fs-1); color: var(--faint); }
  .sheet #shClose { position: absolute; top: 12px; right: 12px; padding: 8px; border-radius: 8px; color: var(--ink2); background: rgb(255 255 255 / 0.06); font-size: var(--fs-3); }
  .sheet #shClose:hover { background: rgb(255 255 255 / 0.12); color: #fff; }

  /* the tabs */
  .sheet .shtabs { position: relative; flex: none; display: flex; align-items: stretch; gap: 2px; padding: 0 16px; min-width: 0; border-bottom: 1px solid var(--line);
    overflow-x: auto; overflow-y: hidden; scrollbar-width: none; overscroll-behavior-x: contain; background: linear-gradient(180deg, rgb(255 252 240 / 0.55), rgb(255 252 240 / 0)); }
  .sheet .shtabs::-webkit-scrollbar { display: none; }
  .sheet .shtab { flex: none; display: inline-flex; align-items: center; gap: 7px; border: 0; border-bottom: 2px solid transparent; border-radius: 6px 6px 0 0; margin: 0; padding: 12px 14px 10px;
    background: none; font: 500 var(--fs-2) var(--ui); color: var(--muted); cursor: pointer; white-space: nowrap; }
  .sheet .shtab svg { color: var(--faint); }
  .sheet .shtab:hover { color: var(--ink); background: rgb(var(--hl) / 0.05); }
  .sheet .shtab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
  .sheet .shtab[aria-selected="true"] svg { color: var(--gold); }
  .sheet .shtab:focus-visible { outline: 2px solid rgb(140 105 25 / 0.5); outline-offset: -6px; border-radius: 8px; }
  .sheet .shtabs.fr { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 40px), transparent); }
  .sheet .shtabs.fl { -webkit-mask-image: linear-gradient(90deg, transparent, #000 40px); mask-image: linear-gradient(90deg, transparent, #000 40px); }
  .sheet .shtabs.fl.fr { -webkit-mask-image: linear-gradient(90deg, transparent, #000 40px, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(90deg, transparent, #000 40px, #000 calc(100% - 40px), transparent); }
  .sheet .shhint { margin-left: auto; align-self: center; padding-left: 16px; font-size: var(--fs-1); color: var(--faint); white-space: nowrap; }

  /* the panels: grids of sections, the area under the tabs scrolls */
  .sheet .shpanels { flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; }
  .sheet .shpanel { display: grid; gap: 4px 32px; align-items: start; padding: 18px 24px 26px; box-sizing: border-box; min-width: 0; }
  .sheet .shpanel:focus { outline: none; }
  .sheet .shpanel:focus-visible { outline: 2px solid var(--gold); outline-offset: -4px; }
  .sheet .shsec { min-width: 0; }
  .sheet .shpanel h4 { margin: 16px 0 8px; font: 600 var(--fs-1) var(--ui); letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
  .sheet .shsec > h4:first-child { margin-top: 0; }
  .sheet .p-portrait { grid-template-columns: minmax(240px, 300px) minmax(0, 1fr) minmax(230px, 290px); grid-template-areas: "a b c"; }
  .sheet .sa-a { grid-area: a; } .sheet .sa-b { grid-area: b; } .sheet .sa-c { grid-area: c; }
  .sheet .p-colours { grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); }
  .sheet .p-inner, .sheet .p-around { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .sheet .p-ledger { grid-template-columns: minmax(0, 1.7fr) minmax(240px, 1fr); }

  /* Portrait */
  .sheet .shport { margin: 0; font: 400 var(--fs-3)/1.58 var(--serif); color: var(--ink); text-wrap: pretty; }

  if (!sheetEl.hidden) { if (e.key === "Escape" || e.key === "c") closeSheet(); return; }
  if (!bookEl.hidden) { if (e.key === "Escape" || e.key === "b") closeBook(); return; }
  if (!worldEl.hidden) { if (e.key === "Escape" || e.key === "g") closeWorld(); return; }
  if (IL.on && !busy && ["Enter", " ", "Escape"].includes(e.key)) { e.preventDefault(); ilFinish(); return; }
  if (IL.on && busy && e.key === "Escape") { pause(); ilFinish(); return; }
  if (e.key === "Escape") { if (menuOpen) { setMenu(false); const m = $("tMenu"); if (m) m.focus(); return; } if (busy) pause(); else if (hud && hud.plan) send("x"); hideTip(); hudEl.classList.remove("open"); return; }
  if (!hud || busy) return;
  const mode = hud.mode;
  if (mode === "menu") { if (hud.menu.some((p) => p.k === e.key)) beginLife(e.key, nameDraft); else if (e.key === "o" || e.key === "b") pageKey(e.key); return; }
  if (!["play", "over"].includes(mode)) return;
  if (hud.plan && e.key !== "Enter" && e.key !== "x" && e.key !== "Escape") { if (/^[1-5]$/.test(e.key)) send(e.key); return; }
  if (e.key === "Enter") { if (e.target.closest("button")) return; e.preventDefault(); send(""); return; }
  if (e.key === "h" || e.key === "?") { openHelp(); return; }
  if (/^[0-9]$/.test(e.key) && hud.cp) {
    const max = hud.cp.options.length;
    digitBuf += e.key; clearTimeout(digitTimer);
    // the number on the card (shown in order, without gaps) is mapped back to the engine's own option number
    const fire = () => { const n = +digitBuf; digitBuf = ""; const o = CPNUM.size ? CPNUM.get(n) : hud.cp.options.find((x) => x.n === n); if (o) send(o.own ? "" : String(o.n)); };
    if (max >= 10 && digitBuf === "1") digitTimer = setTimeout(fire, 450); else fire();
    return;
  }
  if (!hud.cp && ["w", "m", "y", "d"].includes(e.key) && mode === "play") { send(e.key); return; }
  if (["i", "c", "b", "s", "o", "n", "a"].includes(e.key) || (e.key === "g" && (hud.world || (hud.life && hud.life.world_era)))) { pageKey(e.key); return; }
  if (["f", "v", "l", "p"].includes(e.key)) send(e.key);
  if (e.key === "x" && hud.plan) send("x");
});

function fatal(msg) {
  app.dataset.mode = "boot";
  screenEl.innerHTML = `<div class="boot"><div class="hero"><h1>CHROMA</h1></div><p>Could not start: ${esc(msg)}</p><p>This page runs the real engine (Python and numpy) inside your browser with WebAssembly. If the browser or this viewer blocks that, the same game runs in a terminal: python3 play.py in the project's chroma-game/prototype folder (needs Python 3 and numpy).</p></div>`;
}
stageEl.classList.remove("paper");
// v22 next look: a returning player sees the spread at once (the menu is kept from the last visit) while Python loads
if (bootMenu && bootMenu.length) renderScreen({ mode: "menu", menu: bootMenu, booting: true });
else screenEl.innerHTML = `<div class="boot"><div class="hero"><h1>CHROMA</h1><div class="pips">${COLORS.map((c) => pip(c)).join("")}</div><p>One life. Five colors. You are the voice in their head.</p></div><span class="spin"></span><span id="bootMsg">Loading Python and numpy in your browser (about 16 MB the first time)…</span><span class="bootbar"><i></i></span></div>`;
drawLine();
const watchdog = setTimeout(() => { if (!ready) fatal("the Python runtime did not start within 90 seconds."); }, 90000);
try {
  worker = new Worker(new URL("worker.js", location.href).href);
  worker.onmessage = (e) => {
    const m = e.data;
    if (m.kind === "state") { if (!ready) { ready = true; clearTimeout(watchdog); const wm = worldMeta(); if (wm) worker.postMessage({ cmd: "world_in", text: JSON.stringify(wm) }); } applyState(m); }
    else if (m.kind === "sys") { if (!ready) { const b = $("bootMsg"); if (b) b.textContent = m.text; } else { busy = false; toast(m.text); renderTransport(); lockInputs(false); } }
    else if (m.kind === "save") { const w = saveWait; saveWait = null; if (w) w(m.data); }
    else if (m.kind === "world") keepWorld(m.data);
    else if (m.kind === "fatal") { clearTimeout(watchdog); fatal(m.msg); }
  };
  worker.onerror = (e) => { clearTimeout(watchdog); fatal(e.message || "the engine worker failed to load."); };
} catch (e) { clearTimeout(watchdog); fatal(e.message || String(e)); }
</script>
